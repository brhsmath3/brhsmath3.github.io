const draft = {};      // in-memory current selections (not saved)
const lastWrong = {};  // in-memory: how each part did on the last check (true = wrong, false = right, null = changed since)
function neutralize(pid, i){ const lw = lastWrong[pid]; if(!lw) return; lw[i] = null; lw.stale = true; if(lw.every(v => v === null)) delete lastWrong[pid]; }
const selChip = {};    // in-memory: chip currently selected in a matching problem

function mcHtml(p, r, done){
  return `<div class="choices">` + p.c.map((c,ci) => {
    let cls = "choice";
    if(r.w.includes(ci)) cls += " wrong";
    else if(done && ci===p.a) cls += " right";
    else if(done) cls += " locked";
    return `<button class="${cls}" data-c="${ci}" ${(r.w.includes(ci)||done)?"disabled":""}>${c}</button>`;
  }).join("") + `</div>`;
}
function ddHtml(p, r, done){
  let d = draft[p.id];
  if(!d || d.length !== p.parts.length) d = draft[p.id] = p.parts.map(() => -1);
  p.parts.forEach((pt, i) => { if(!(d[i] >= -1 && d[i] < pt.o.length)) d[i] = -1; });
  const lw = lastWrong[p.id] || [];
  const rows = p.parts.map((pt,i) => {
    const val = done ? pt.a : d[i];
    const cls = done ? "good" : lw[i] === true ? "bad" : lw[i] === false ? "right" : "";
    if(pt.b) return `<div class="part pb ${cls} ${pt.span ? "span2" : ""}"><span class="plabel">${pt.t}</span><div class="optrow" role="group" aria-label="Answer for part ${i+1}">${pt.o.map((o,oi) => `<button class="optb ${val===oi?"on":""}" data-part="${i}" data-opt="${oi}" aria-pressed="${val===oi}" ${done?"disabled":""}>${o}</button>`).join("")}</div></div>`;
    return `<div class="part ${cls}"><span class="plabel">${pt.t}</span>
      <select data-part="${i}" ${done?"disabled":""} aria-label="Answer for part ${i+1}">
        <option value="-1" ${val===-1?"selected":""}>Choose…</option>
        ${pt.o.map((o,oi) => `<option value="${oi}" ${val===oi?"selected":""}>${esc(o)}</option>`).join("")}
      </select></div>`;
  }).join("");
  const btn = done ? "" : `<button class="pill unit checkbtn" data-check ${d.every(v=>v>-1)?"":"disabled"}>Check answer</button>`;
  return `<div class="parts ${p.cols === 2 ? "two" : ""}">${rows}</div>${btn}`;
}
function matchHtml(p, r, done){
  let d = draft[p.id];
  if(!d || d.length !== p.rows.length) d = draft[p.id] = p.rows.map(() => -1);
  const seen = new Set(); d.forEach((v, i) => { if(!(v >= -1 && v < p.chips.length) || (v > -1 && seen.has(v))) d[i] = -1; else if(v > -1) seen.add(v); });
  const lw = lastWrong[p.id] || [];
  const used = new Set(d.filter(v => v > -1));
  const sel = selChip[p.id];
  const rows = p.rows.map((row,i) => {
    const ci = done ? row.a : d[i];
    const cls = done ? "good" : lw[i] === true ? "bad" : lw[i] === false ? "right" : (ci>-1 ? "filled" : "");
    return `<div class="mrow"><span class="plabel">${row.t}</span>
      <button class="slot ${cls}" data-slot="${i}" ${done?"disabled":""}>${ci>-1 ? p.chips[ci] : "drop here"}</button></div>`;
  }).join("");
  const bank = done ? "" : `<p class="tip">${p.instr || "Drag a value onto its equation, or tap a value and then tap the equation."}</p>
    <div class="bank">${p.chips.map((c,ci) => used.has(ci) ? "" : `<button class="chip ${sel===ci?"sel":""}" draggable="true" data-chip="${ci}">${c}</button>`).join("") || `<span class="muted">All values placed</span>`}</div>`;
  const btn = done ? "" : `<button class="pill unit checkbtn" data-check ${d.every(v=>v>-1)?"":"disabled"}>Check answer</button>`;
  return `<div class="matchwrap"><div class="mleft"><div class="parts">${rows}</div></div><div class="mright">${bank}</div></div>${btn}`;
}

function wbPageTag(p){
  const [u, l] = p.id.split("-");
  const pg = (WB_PAGES[u] && WB_PAGES[u][l] || {})[parseInt(p.n, 10)];
  return pg ? ` <span class="pill sm wbpg">Workbook page ${pg}</span>` : "";
}
function qHtml(p){
  const r = progress[p.id] || {w:[],d:0,h:0};
  const done = !!r.d;
  const multi = p.type === "dd" || p.type === "match";
  const extra = p.html ? `<div class="qextra ${p.side ? "qgraph" : ""}">${p.html}</div>` : "";
  const body = p.type==="dd" ? ddHtml(p,r,done) : p.type==="match" ? matchHtml(p,r,done) : mcHtml(p,r,done);
  let fb = "";
  const lw = lastWrong[p.id];
  if(done) fb = `<div class="fb">✅ Correct! You earned ${pts(p)}% on this one.${isLate(...p.id.split("-").slice(0, 2), progress[p.id]) ? ` <b>It was finished after the due date, so it is marked late.</b>` : ""}</div>`;
  else if(multi && lw && lw.length && !lw.stale) fb = `<div class="fb">❌ ${lw.filter(x => x === false).length} of ${lw.length} parts are correct (green). Fix the red ones and check again (−${PENALTY}% for each wrong check).</div>`;
  else if(!multi && r.w.length) fb = `<div class="fb">❌ Not quite. Try again (−${PENALTY}% for each wrong answer).</div>`;
  const hint = r.h ? `<div class="hintbox"><b>Hint:</b> ${p.hint}</div>` : "";
  const hbtn = (!r.h && !done) ? `<button class="pill sm hintbtn" data-hint>💡 Use my hint (1 per problem)</button>` : "";
  return `<div class="q ${p.side ? "withside" : ""} ${p.wide ? "wide" : ""}" id="q-${p.id}">
    <div class="num"><span class="ptitle">Problem ${esc(p.n)}</span> ${p.honors?`<span class="pill sm">Honors</span>`:""}${wbPageTag(p)}${lateTag(p)}</div>
    <div class="text">${p.q}</div>${extra}<div class="qbody">${body}${fb}${hint}${hbtn}</div></div>`;
}

function rerender(p, l){
  const el = document.getElementById("q-" + p.id);
  el.outerHTML = qHtml(p);
  refreshStats(l);
  bind(p, l);
}
function recordRow(p){ return progress[p.id] = progress[p.id] || {w:[],d:0,h:0}; }

function checkMulti(p, l){
  const r = recordRow(p);
  const d = draft[p.id];
  const answers = (p.type==="dd" ? p.parts : p.rows).map(x => x.a);
  const ok = d.map((v,i) => v === answers[i]);
  if(ok.every(Boolean)){ r.d = 1; r.t = Date.now(); delete lastWrong[p.id]; }
  else {
    const key = JSON.stringify(d);
    if(!r.w.includes(key)) r.w.push(key);
    lastWrong[p.id] = ok.map(x => !x);
  }
  save(); rerender(p, l);
}

function placeChip(p, l, slot, chip){
  draft[p.id][slot] = chip;
  delete selChip[p.id]; neutralize(p.id, slot); saveDrafts();
  rerender(p, l);
}

function bind(p, l){
  const el = document.getElementById("q-" + p.id);
  // multiple choice
  el.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    const r = recordRow(p);
    if(r.d) return;
    const ci = +b.dataset.c;
    if(ci === p.a){ r.d = 1; r.t = Date.now(); } else if(!r.w.includes(ci)) r.w.push(ci);
    save(); rerender(p, l);
  });
  // drop-downs
  el.querySelectorAll("select[data-part]").forEach(s => s.onchange = () => {
    draft[p.id][+s.dataset.part] = +s.value;
    neutralize(p.id, +s.dataset.part); saveDrafts();
    const pe = s.closest(".part"); if(pe) pe.classList.remove("bad", "right");
    const f = el.querySelector(".fb"); if(f) f.remove();
    const cb = el.querySelector("[data-check]"); if(cb) cb.disabled = !draft[p.id].every(v => v > -1);
  });
  // button-style answer parts
  el.querySelectorAll("button.optb").forEach(b => b.onclick = () => {
    const r = progress[p.id]; if(r && r.d) return;
    draft[p.id][+b.dataset.part] = +b.dataset.opt;
    neutralize(p.id, +b.dataset.part); saveDrafts();
    rerender(p, l);
  });
  // matching (drag and drop + tap)
  el.querySelectorAll("[data-chip]").forEach(c => {
    c.onclick = () => { const ci = +c.dataset.chip; if(selChip[p.id]===ci) delete selChip[p.id]; else selChip[p.id] = ci; rerender(p, l); };
    c.ondragstart = e => { e.dataTransfer.setData("text/plain", c.dataset.chip); e.dataTransfer.effectAllowed = "move"; };
  });
  el.querySelectorAll("[data-slot]").forEach(s => {
    const i = +s.dataset.slot;
    s.onclick = () => {
      if(selChip[p.id] !== undefined) placeChip(p, l, i, selChip[p.id]);
      else if(draft[p.id][i] > -1){ neutralize(p.id, i); draft[p.id][i] = -1; saveDrafts(); rerender(p, l); }
    };
    s.ondragover = e => { e.preventDefault(); s.classList.add("over"); };
    s.ondragleave = () => s.classList.remove("over");
    s.ondrop = e => { e.preventDefault(); const ci = parseInt(e.dataTransfer.getData("text/plain"), 10); if(!isNaN(ci)) placeChip(p, l, i, ci); };
  });
  const cb = el.querySelector("[data-check]");
  if(cb) cb.onclick = () => checkMulti(p, l);
  // hint
  const hb = el.querySelector("[data-hint]");
  if(hb) hb.onclick = () => { recordRow(p).h = 1; save(); rerender(p, l); };
}



/* ============================================================
   OPTIONAL BACKUP TO THE TEACHER'S GOOGLE SHEET
   Off unless BACKUP has an entry for the student's teacher. It never gets in the student's way:
   if anything fails, the work is still saved on this device and the backup keeps retrying.
   Sending is "send, then ask the sheet whether it really arrived", so a lost message heals itself.
   ============================================================ */
const BK = {timer: null, vtimer: null, rtimer: null, sending: false, fails: 0, afterFlush: false, state: "", ok: {}};
const BK_LABEL = {saving: "Saving…", ok: "Backed up ✓", offline: "Backup offline"};
const BK_TITLE = {saving: "Saving your work to your teacher's backup", ok: "Your work is backed up", offline: "The backup can't be reached right now. Your work is still saved on this device, and it will be sent when the connection is back."};
const bkCfg = () => {
  if(!(S.student && S.teacher)) return null;
  const c = BACKUP[S.teacher.id] && (BACKUP[S.teacher.id].url || BACKUP[S.teacher.id].form || BACKUP[S.teacher.id].sb) ? BACKUP[S.teacher.id] : BACKUP["*"];
  return c && (c.url || c.form || c.sb) ? c : null;
};
const bkSig = r => [r.d ? 1 : 0, r.h ? 1 : 0, (r.w || []).length, r.t || 0].join("|");
// is copy a further along than copy b? Finished beats unfinished; two finished copies: the first stands. (The sheet uses the same rule.)
function bkAhead(a, b){
  if(!b) return true;
  if(!!a.d !== !!b.d) return !!a.d;
  if(a.d) return false;
  const aw = (a.w || []).length, bw = (b.w || []).length;
  if(aw !== bw) return aw > bw;
  return !!a.h && !b.h;
}
// how does this device's copy compare with the sheet's?   same | send (ours is further along) | adopt (the sheet's is)
function bkRel(local, server){
  if(!server) return "send";
  if(local && bkSig(local) === bkSig(server)) return "same";
  if(!local) return "adopt";
  if(local.d && server.d) return "adopt";
  return bkAhead(local, server) ? "send" : "adopt";
}
function bkProblem(id){
  const [u, l, i] = id.split("-"), les = (CONTENT[u] || []).find(x => String(x.id) === l);
  return les && les.problems[+i] ? les.problems[+i] : null;
}
function bkRec(id){
  const r = progress[id], p = bkProblem(id) || {}, [u, l] = id.split("-");
  return {k: id, n: p.n === undefined ? "" : String(p.n), hon: p.honors ? 1 : 0, d: r.d ? 1 : 0, h: r.h ? 1 : 0, w: r.w || [], t: r.t || 0, late: isLate(u, l, r) ? 1 : 0};
}
const bkVerKey = () => "mph4v:" + S.student.h;    // which results the sheet is known to have
function bkSaveVer(){ try{ localStorage.setItem(bkVerKey(), JSON.stringify(BK.ok)); }catch(e){} }
const bkDirtyIds = () => Object.keys(progress).filter(id => progress[id] && bkProblem(id) && BK.ok[id] !== bkSig(progress[id]));
function bkBody(c, ids){
  return JSON.stringify({k: c.key, id: S.student.id, t: S.teacher.id, tn: S.teacher.name, lv: S.student.level, recs: ids.slice(0, 120).map(bkRec)});
}
function bkLabelHtml(){
  return BK.state && bkCfg() ? `<span class="bkst ${BK.state}" id="bkst" title="${BK_TITLE[BK.state]}">${BK_LABEL[BK.state]}</span>` : "";
}
function bkStatus(s){
  BK.state = s;
  const el = document.getElementById("bkst");
  if(el){ el.className = "bkst " + s; el.textContent = BK_LABEL[s] || ""; el.title = BK_TITLE[s] || ""; }
}
function bkToast(n){
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status");
  t.textContent = "Restored " + n + " saved problem" + (n === 1 ? "" : "s") + " from your backup.";
  document.body.appendChild(t); setTimeout(() => t.remove(), 6000);
}
// read from the sheet. A <script> tag is the one way a web page can read from Google's servers from any site.
function bkJsonp(c, params){
  return new Promise((resolve, reject) => {
    const cb = "bkcb" + Math.random().toString(36).slice(2, 10), s = document.createElement("script");
    let done = false, t = null;
    const end = (v, err) => { if(done) return; done = true; clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } s.remove(); err ? reject(err) : resolve(v); };
    t = setTimeout(() => end(null, new Error("timeout")), 15000);
    window[cb] = v => end(v);
    s.onerror = () => end(null, new Error("network"));
    s.src = c.url + (c.url.includes("?") ? "&" : "?") + new URLSearchParams({...params, k: c.key, cb, _: Date.now()}).toString();
    document.head.appendChild(s);
  });
}

// ---- GOOGLE FORM TRANSPORT: results go out as a form post; they are read back by querying the form's sheet ----
// (A page cannot see whether a form post worked, so "Backed up" is only ever shown after the sheet itself confirms the results.)
const BK_REC_RE = /^\d{1,2}-[0-9A-Za-z]{1,3}-\d{1,3}$/;
const GVP = {};
(function(){ const g = (window.google = window.google || {}); g.visualization = g.visualization || {}; g.visualization.Query = g.visualization.Query || {};
  g.visualization.Query.setResponse = r => { const f = GVP[r && r.reqId]; if(f) f(r); }; })();
const gvCols = c => c.cols || {t: "B", id: "C", k: "D", p: "E"};
const gvEsc = v => String(v).replace(/['\\]/g, "\\$&");
function gvQuery(c, query){                       // ask the sheet a question. A <script> tag is how a page reads from Google's servers.
  return new Promise((resolve, reject) => {
    const id = "q" + Math.random().toString(36).slice(2, 9), s = document.createElement("script");
    let done = false, t = null;
    const end = (v, err) => { if(done) return; done = true; clearTimeout(t); delete GVP[id]; s.remove(); err ? reject(err) : resolve(v); };
    t = setTimeout(() => end(null, new Error("timeout")), 20000);
    GVP[id] = r => r && r.status === "ok" ? end(r) : end(null, new Error((r && r.errors && r.errors[0] && (r.errors[0].detailed_message || r.errors[0].message)) || "query error"));
    s.onerror = () => end(null, new Error("network"));
    const p = new URLSearchParams({tqx: "out:json;reqId:" + id, tq: query, headers: "1"}); if(c.tab) p.set("sheet", c.tab);
    s.src = c.sheet + "?" + p.toString(); document.head.appendChild(s);
  });
}
const gvCell = (row, i) => row.c && row.c[i] && row.c[i].v !== null && row.c[i].v !== undefined ? row.c[i].v : "";
function bkParseRecs(text, into){                  // one submitted row holds a list of results; keep the further-along copy of each problem
  let arr; try{ arr = JSON.parse(text); }catch(e){ return; }
  if(!Array.isArray(arr)) return;
  arr.slice(0, 200).forEach(r => {
    if(!r || typeof r.k !== "string" || !BK_REC_RE.test(r.k)) return;
    const rec = {d: r.d ? 1 : 0, h: r.h ? 1 : 0, w: Array.isArray(r.w) ? r.w.slice(0, 60).map(x => typeof x === "number" ? x : String(x).slice(0, 40)) : [], t: Number(r.t) > 0 ? Number(r.t) : 0};
    if(!into[r.k] || bkAhead(rec, into[r.k])) into[r.k] = rec;
  });
}
async function bkFormStudent(c, id){
  const k = gvCols(c), who = S.tId || (S.teacher && S.teacher.id);
  const res = await gvQuery(c, `select ${k.p} where ${k.t} = '${gvEsc(who)}' and ${k.id} = '${gvEsc(id)}' and ${k.k} = '${gvEsc(c.key)}' order by A`);
  const recs = {}; (res.table.rows || []).forEach(row => bkParseRecs(gvCell(row, 0), recs));
  return {ok: true, recs};
}
async function bkFormClass(c, full){              // the whole class. After the first load, only rows added since the last one.
  const k = gvCols(c); if(full || !TR.data){ TR.data = {}; TR.seen = 0; }
  const res = await gvQuery(c, `select ${k.id}, ${k.p} where ${k.t} = '${gvEsc(S.tId)}' and ${k.k} = '${gvEsc(c.key)}' order by A limit 50000 offset ${TR.seen || 0}`);
  const rows = res.table.rows || [];
  rows.forEach(row => { const id = String(gvCell(row, 0)); if(!id) return; bkParseRecs(gvCell(row, 1), TR.data[id] = TR.data[id] || {}); });
  TR.seen = (TR.seen || 0) + rows.length;
  return TR.data;
}
function bkFormFields(c, ids){
  const f = new URLSearchParams();
  f.set(c.entry.t, S.teacher.id); f.set(c.entry.id, S.student.id); f.set(c.entry.k, c.key);
  f.set(c.entry.p, JSON.stringify(ids.map(bkRec)));

}

// ---- SUPABASE TRANSPORT: results go to a few database functions, and the database's own answer confirms them ----
async function sbRpc(c, fn, args, keepalive){
  const headers = {"Content-Type": "application/json", "apikey": c.key};
  if(/^eyJ/.test(c.key)) headers["Authorization"] = "Bearer " + c.key;      // an old-style key also goes here. The new publishable key must NOT.
  const res = await fetch(c.sb.replace(/\/+$/, "") + "/rest/v1/rpc/" + fn, {method: "POST", headers, body: JSON.stringify(args), keepalive: !!keepalive});
  let data = null; try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((data && (data.message || data.error || data.hint)) || ("HTTP " + res.status));
  if(data && data.ok === false) throw new Error(data.error || "refused");
  return data;
}
async function bkSbStudent(c, id){
  const r = await sbRpc(c, "hw_get", {p_teacher: S.tId || S.teacher.id, p_id: id});
  return {ok: true, recs: r.recs || {}};
}
async function bkSbClass(c, full){                // the whole class. After the first load, only what changed since (with a minute of overlap).
  if(full || !TR.data){ TR.data = {}; TR.since = null; }
  const r = await sbRpc(c, "hw_class", {p_teacher: S.tId, p_code: S.tCode, p_since: TR.since || null});
  Object.keys(r.students || {}).forEach(id => {
    const into = TR.data[id] = TR.data[id] || {}, recs = r.students[id];
    Object.keys(recs).forEach(k => { const rec = recs[k]; if(!into[k] || bkAhead(rec, into[k])) into[k] = {d: rec.d ? 1 : 0, h: rec.h ? 1 : 0, w: rec.w || [], t: rec.t || 0}; });
  });
  const now = Date.parse(r.now); TR.since = isNaN(now) ? null : new Date(now - 60000).toISOString();
  return TR.data;
}
async function bkGetStudent(c, id){ return c.sb ? bkSbStudent(c, id) : c.form ? bkFormStudent(c, id) : bkJsonp(c, {a: "get", id, t: S.teacher.id}); }

// take anything the sheet has that is further along than this device (this is what brings lost work back)
function bkMerge(recs){
  let restored = 0, adopted = 0;
  Object.keys(recs || {}).forEach(id => {
    const s = recs[id], l = progress[id];
    if(!/^\d{1,2}-[0-9A-Za-z]{1,3}-\d{1,3}$/.test(id) || !bkProblem(id) || !s) return;
    if(bkRel(l, s) !== "adopt") return;
    progress[id] = {w: Array.isArray(s.w) ? s.w.slice(0, 60) : [], d: s.d ? 1 : 0, h: s.h ? 1 : 0};
    if(s.t) progress[id].t = s.t;
    adopted++;
    if(!l || !l.d) restored++;
  });
  return {restored, adopted};
}
async function bkVerify(){
  const c = bkCfg(), st = S.student; if(!c) return;
  const afterFlush = BK.afterFlush; BK.afterFlush = false;
  try{
    const res = await bkGetStudent(c, st.id);
    if(S.student !== st) return;
    if(!res || !res.ok) throw new Error((res && res.error) || "bad reply");
    await bkApply(c, st, res.recs || {}, afterFlush, true);
  }catch(e){
    if(S.student !== st) return;
    BK.fails++; bkStatus(BK.fails >= 3 ? "offline" : "saving");
    clearTimeout(BK.rtimer); BK.rtimer = setTimeout(bkVerify, Math.min(120000, 4000 * Math.pow(2, BK.fails)));
  }
}
// compare this device's work with what the backup holds: take what is further along, note what is confirmed, send what is missing
async function bkApply(c, st, recs, afterFlush, withAlias){
  let {restored, adopted} = bkMerge(recs);
  if(withAlias) for(const oldId of (st.aliasIds || [])){            // a corrected ID: also pick up work saved under the old one
    try{
      const r2 = await bkGetStudent(c, oldId);
      if(r2 && r2.ok){ const m2 = bkMerge(r2.recs || {}); restored += m2.restored; adopted += m2.adopted; }
    }catch(e){}
  }
  if(S.student !== st) return;
  Object.keys(progress).forEach(id => { const s = recs[id]; if(s && progress[id] && bkSig(s) === bkSig(progress[id])) BK.ok[id] = bkSig(progress[id]); });
  bkSaveVer();
  if(adopted){ try{ localStorage.setItem(storeKey(), JSON.stringify(progress)); }catch(e){} }     // keep the backup's version on this device too
  if(restored){ bkToast(restored); const y = window.scrollY; render(); window.scrollTo(0, y); }
  if(bkDirtyIds().length){
    if(afterFlush) BK.fails++;
    bkStatus(BK.fails >= 3 ? "offline" : "saving");
    clearTimeout(BK.rtimer); BK.rtimer = setTimeout(bkFlush, afterFlush ? Math.min(120000, 3000 * Math.pow(2, BK.fails)) : 0);
  }else{ BK.fails = 0; bkStatus("ok"); }
}
async function bkFlush(){
  const c = bkCfg(), st = S.student; if(!c || BK.sending) return;
  const ids = bkDirtyIds(); if(!ids.length) return;
  BK.sending = true;
  try{
    if(c.sb){                                       // the database answers with what it now holds, which confirms the save by itself
      const held = {};
      for(let i = 0; i < ids.length; i += 60){
        const res = await sbRpc(c, "hw_put", {p_teacher: S.teacher.id, p_id: S.student.id, p_recs: ids.slice(i, i + 60).map(bkRec)});
        Object.assign(held, res.recs || {});
      }
      BK.sending = false;
      if(S.student === st) await bkApply(c, st, held, true, false);
      return;
    }
    if(c.form){ for(let i = 0; i < ids.length; i += 60) await fetch(c.form, {method: "POST", mode: "no-cors", body: bkFormFields(c, ids.slice(i, i + 60))}); }
    else await fetch(c.url, {method: "POST", mode: "no-cors", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: bkBody(c, ids)});
    if(S.student === st){ BK.afterFlush = true; clearTimeout(BK.vtimer); BK.vtimer = setTimeout(bkVerify, c.form ? 7000 : 4000); }
  }catch(e){
    if(S.student === st){
      BK.fails++; bkStatus(BK.fails >= 3 ? "offline" : "saving");
      clearTimeout(BK.rtimer); BK.rtimer = setTimeout(bkFlush, Math.min(120000, 3000 * Math.pow(2, BK.fails)));
    }
  }
  BK.sending = false;
}
function bkMark(){            // called after every save: something new may need sending
  if(!bkCfg() || !bkDirtyIds().length) return;
  bkStatus("saving");
  clearTimeout(BK.timer); BK.timer = setTimeout(bkFlush, 3000);
}
function bkStart(){           // on login: ask the sheet what it has, take anything further along, and send anything it lacks
  bkStop();
  if(!bkCfg()) return;
  try{ BK.ok = JSON.parse(localStorage.getItem(bkVerKey())) || {}; }catch(e){ BK.ok = {}; }
  bkStatus("saving"); bkVerify();
}
function bkStop(){
  ["timer", "vtimer", "rtimer"].forEach(k => { clearTimeout(BK[k]); BK[k] = null; });
  BK.sending = false; BK.fails = 0; BK.afterFlush = false; BK.state = ""; BK.ok = {};
}
function bkBeacon(){          // the tab is closing: one last try, which the browser finishes even after the page is gone
  const c = bkCfg(); if(!c) return;
  const ids = bkDirtyIds(); if(!ids.length) return;
  try{
    if(c.sb){ for(let i = 0; i < ids.length; i += 60) sbRpc(c, "hw_put", {p_teacher: S.teacher.id, p_id: S.student.id, p_recs: ids.slice(i, i + 60).map(bkRec)}, true).catch(() => {}); }
    else if(c.form){ for(let i = 0; i < ids.length; i += 60) navigator.sendBeacon(c.form, bkFormFields(c, ids.slice(i, i + 60))); }
    else navigator.sendBeacon(c.url, new Blob([bkBody(c, ids)], {type: "text/plain;charset=UTF-8"}));

}
addEventListener("pagehide", bkBeacon);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") bkBeacon(); });

/* ============================================================
   TEACHER DASHBOARD: THE WHOLE CLASS, FROM THE BACKUP SHEET

const TR = {state: "", at: 0, data: null, busy: false, err: "", timer: null, seen: 0, n: 0};

  return c && (c.url || c.form || c.sb) ? c : null;

async function trLoad(full){

// GRADING BASIS: Standard classes are graded on completion. Honors classes are graded on accuracy.
const gradeFor = (level, done, n, acc) => level === "honors" ? (acc === null ? 0 : acc) : Math.round(done / n * 100);

function lessonStatsFromProgress(lesson, unit, level, prog){
  const ps = lesson.problems.map((p,i) => ({...p, id: unit + "-" + lesson.id + "-" + i}))
    .filter(p => !p.retired && (level === "honors" || !p.honors));
  const late = p => isLate(unit, lesson.id, prog[p.id]);
  const pts = p => prog[p.id] && prog[p.id].d ? Math.max(0, 100 - PENALTY * prog[p.id].w.length - (late(p) ? LATE_PENALTY : 0)) : null;
  const doneP = ps.filter(p => pts(p) !== null);
  const acc = doneP.length ? Math.round(mean(doneP.map(pts))) : null;
  return {n: ps.length, done: doneP.length, acc, late: doneP.filter(late).length, score: gradeFor(level, doneP.length, ps.length, acc)};
}

// STANDARDS: every problem tagged with a standard counts toward it. Only finished problems are scored

function alignedProblems(unit){

  })));

function standardStats(unit, level, prog){

    const pts = mine.map(x => prog[x.id] && prog[x.id].d ? Math.max(0, 100 - PENALTY * prog[x.id].w.length) : null).filter(v => v !== null);
    res[code] = {n: mine.length, done: pts.length, score: pts.length ? Math.round(mean(pts)) : null};
  });

}

// Made-up progress for roster students with no saved progress on this device. It has the same shape as
// real progress, so lessons, unit grades and standards are all calculated the same way.
function hash32(str){ let h = 2166136261 >>> 0; for(const c of str){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; }
function mix(h){ h ^= h >>> 16; h = Math.imul(h, 2246822507) >>> 0; h ^= h >>> 13; h = Math.imul(h, 3266489909) >>> 0; h ^= h >>> 16; return h >>> 0; }
const rand01 = (seed, k) => mix((seed + Math.imul(k, 2654435761)) >>> 0) / 4294967296;
// A believable list of wrong attempts for one problem, in the same shape real progress uses: for multiple choice a list of
// the wrong choices picked, for the others a list of the wrong answer sets that were checked.
function sampleWrong(p, seed, count, ability, sid){
  const tags = Object.keys(MISC);
  const prone = t => t && rand01(sid, 1000 + tags.indexOf(t)) < 0.13;     // each student has a few misconceptions they keep repeating
  const tagW = t => (t ? 0.4 + 1.2 * rand01(hash32(t), 5) : 0.35) * (prone(t) ? 14 : 1);   // and some misconceptions are more common overall
  const pick = (n, ans, tags, k) => {
    const cands = []; for(let i = 0; i < n; i++) if(i !== ans) cands.push(i);
    const ws = cands.map(i => tagW(tags && tags[i])), tot = ws.reduce((x, y) => x + y, 0);
    let r = rand01(seed, k) * tot;
    for(let j = 0; j < cands.length; j++){ r -= ws[j]; if(r <= 0) return cands[j]; }
    return cands[cands.length - 1];
  };
  if(p.type === "mc"){
    const out = [];
    for(let a = 0; a < count && out.length < p.c.length - 1; a++){
      let i = pick(p.c.length, p.a, p.cm, 100 + a);
      for(let t = 0; out.includes(i) && t < 8; t++) i = pick(p.c.length, p.a, p.cm, 150 + a * 9 + t);
      if(out.includes(i)) i = p.c.map((_, j) => j).find(j => j !== p.a && !out.includes(j));
      out.push(i);
    }
    return out;
  }
  const items = p.type === "dd" ? p.parts : p.rows, nOpt = j => p.type === "dd" ? items[j].o.length : p.chips.length, tg = j => items[j].m;
  const keys = [];
  for(let a = 0; a < count; a++){
    const d = items.map((it, j) => rand01(seed, 200 + a * 17 + j) < 0.18 + 0.5 * (1 - ability) ? pick(nOpt(j), it.a, tg(j), 300 + j) : it.a);   // the same slip tends to repeat from attempt to attempt
    if(d.every((v, j) => v === items[j].a)){ const j = Math.floor(rand01(seed, 400 + a) * items.length); d[j] = pick(nOpt(j), items[j].a, tg(j), 500 + a); }
    const key = JSON.stringify(d); if(!keys.includes(key)) keys.push(key);
  }
  return keys;
}
function sampleProgress(id, level, unit){
  const prog = {}, sid = hash32(id);
  if(rand01(sid, 9) < 0.06) return prog;                    // a few students haven't started
  const ability = rand01(sid, 7), effort = rand01(sid, 8);
  (CONTENT[unit] || []).forEach(l => l.problems.forEach((p, i) => {
    if(p.retired || (p.honors && level !== "honors")) return;
    const seed = hash32(id + "|" + l.id + "|" + i);
    if(rand01(seed, 1) > 0.45 + 0.55 * effort) return;      // not finished
    const firstTry = rand01(seed, 2) < 0.2 + 0.75 * ability;
    const wrong = firstTry ? 0 : 1 + Math.floor(rand01(seed, 3) * (2 + 12 * Math.pow(1 - ability, 1.5)));
    const dueAt = partFor(unit, l.id), day = 86400000;
    const t = dueAt ? dueAt.due.getTime() + (rand01(seed, 6) < 0.13 ? 1 : -1) * (0.3 + 6 * rand01(seed, 7)) * day : undefined;   // about 1 in 8 is late
    prog[unit + "-" + l.id + "-" + i] = {w: sampleWrong(p, seed, wrong, ability, sid), d: 1, h: 0, t};
  }));
  return prog;
}

// Which misconceptions does this student's saved work show? Returns { misconception : { "L4 #9": how many times } }.
function misconceptionHits(unit, level, prog){
  const hits = {};
  const add = (tag, label) => { const h = hits[tag] = hits[tag] || {}; h[label] = (h[label] || 0) + 1; };
  (CONTENT[unit] || []).forEach(l => l.problems.forEach((p, i) => {
    if(p.retired || (p.honors && level !== "honors")) return;
    const r = prog[unit + "-" + l.id + "-" + i]; if(!r || !r.w || !r.w.length) return;
    const label = `L${l.id} #${p.n}`;
    r.w.forEach(w => {
      if(p.type === "mc"){ const t = p.cm && p.cm[w]; if(t) add(t, label); return; }
      let d = null; try{ d = typeof w === "string" ? JSON.parse(w) : null; }catch(e){}
      if(!Array.isArray(d)) return;
      const items = p.type === "dd" ? p.parts : p.rows;
      d.forEach((v, j) => { if(items[j] && v !== items[j].a && items[j].m && items[j].m[v]) add(items[j].m[v], label); });
    });
  }));
  return hits;
}

// THE ONE PLACE TO SWAP when a real backend exists: return one row per student for the unit.
async function loadClassData(unit){
  const lessons = CONTENT[unit] || [];
  const parts = PARTS[unit] || {p1:[], p2:[]};
  const rows = [];
  for(const st of ROSTER.filter(r => r.t === S.tId)){
    const h = await sha(st.t + ":" + st.id);
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem("mph4:" + h)); }catch(e){}
    const take = (recs) => {                                      // add whichever copy of each problem is further along
      if(!recs) return;
      saved = saved ? {...saved} : {};
      Object.keys(recs).forEach(k => {
        const r = recs[k];
        if(!saved[k] || bkAhead(r, saved[k])) saved[k] = {w: r.w || [], d: r.d ? 1 : 0, h: r.h ? 1 : 0, ...(r.t ? {t: r.t} : {})};
      });
    };
    take(TR.data && TR.data[st.id]);                                // this student's work from the backup sheet
    for(const a of (ID_ALIASES[st.t + ":" + st.id] || [])){          // and anything saved under their old ID
      let old = null; try{ old = JSON.parse(localStorage.getItem("mph4:" + await sha(st.t + ":" + a))); }catch(e){}
      take(old); take(TR.data && TR.data[a]);
    }
    const live = !!saved && Object.keys(saved).some(k => k.startsWith(unit + "-"));
    const prog = live ? saved : (S.sample && !st.test ? sampleProgress(st.id, st.level, unit) : {});   // the test student never gets made-up work   // made-up work only in sample mode
    const per = {};
    lessons.forEach(l => {
      const n = l.problems.filter(p => !p.retired && (st.level === "honors" || !p.honors)).length;
      per[l.id] = (!n || (!live && (!S.sample || st.test))) ? null : lessonStatsFromProgress(l, unit, st.level, prog);   // no saved work on this device = no data (not 0%)
    });
    const partGrade = ids => { const v = ids.map(i => per[i]).filter(Boolean).map(x => x.score); return v.length ? mean(v) : null; };
    const p1 = partGrade(parts.p1), p2 = partGrade(parts.p2);
    const halves = [p1, p2].filter(v => v !== null);
    rows.push({...st, period: st.id[0], live, per, std: standardStats(unit, st.level, prog), misc: misconceptionHits(unit, st.level, prog),
               p1: rnd(p1), p2: rnd(p2), unit: rnd(halves.length ? mean(halves) : null)});
  }
  rows.sort((a,b) => a.id.localeCompare(b.id));
  return rows;
}

function unitOverview(rows, unit){
  const ls = (CONTENT[unit] || []).filter(l => l.problems.length);
  const comps = [], accs = []; let notStarted = 0;
  rows.forEach(r => {
    const ps = ls.map(l => r.per[l.id]).filter(Boolean);
    const n = ps.reduce((s, x) => s + x.n, 0), d = ps.reduce((s, x) => s + x.done, 0);
    if(!n) return;
    comps.push(d / n * 100); if(d === 0) notStarted++;
    const w = ps.filter(x => x.acc !== null), dw = w.reduce((s, x) => s + x.done, 0);
    if(dw) accs.push(w.reduce((s, x) => s + x.acc * x.done, 0) / dw);
  });
  return {students: rows.length, worked: comps.length, blocks: new Set(rows.map(r => r.period)).size, comp: rnd(mean(comps)), acc: rnd(mean(accs)), notStarted,
          levels: LEVELS.map(L => rows.filter(r => r.unit !== null && levelOf(r.unit).key === L.key).length)};
}

function miscSection(shown){
  const by = {};
  shown.forEach(r => Object.keys(r.misc || {}).forEach(t => { if(MISC[t]) (by[t] = by[t] || []).push(r); }));
  const times = (r, t) => Object.keys(r.misc[t]).length;
  const ranked = Object.keys(by).map(t => ({t, rows: by[t].slice().sort((a, b) => times(b, t) - times(a, t) || a.id.localeCompare(b.id))}))
    .sort((a, b) => b.rows.length - a.rows.length || MISC[a.t].t.localeCompare(MISC[b.t].t)).slice(0, 8);
  const list = ranked.map((m, i) => {
    const where = {}; m.rows.forEach(r => Object.keys(r.misc[m.t]).forEach(lb => { where[lb] = (where[lb] || 0) + 1; }));
    const seen = Object.keys(where).sort((a, b) => where[b] - where[a] || a.localeCompare(b)).slice(0, 5);
    const pct = Math.round(100 * m.rows.length / shown.length);
    return `<li class="misc"><div class="mhead"><span class="mrank">${i + 1}</span>
        <div class="mtext"><b>${MISC[m.t].t}</b><span class="meg">e.g. ${MISC[m.t].eg}</span></div>
        <span class="mcount"><b>${m.rows.length}</b>of ${shown.length} students<small>${pct}%</small></span></div>
      <div class="mwhere">Seen in ${seen.map(esc).join(" · ")}</div>
      <div class="mchips">${m.rows.map(r => `<span class="mchip ${r.live ? "live" : ""}" title="${esc(r.id)}: ${Object.keys(r.misc[m.t]).map(esc).join(", ")}">${esc(r.id)}</span>`).join("")}</div></li>`;
  }).join("");
  return `<h2 class="vtitle" style="margin-top:26px">Common misconceptions</h2>

}

    const lessonScore = (r, l) => r.per[l.id] ? r.per[l.id].score : null;
    title = `Block ${esc(S.tBlock)} · Unit ${unit} grade`;
    chips = LEVELS.map(L => `<span class="lvl ${L.key}">${lvIcon(L.key)}${L.label} <b>${shown.filter(r => r.unit !== null && levelOf(r.unit).key === L.key).length}</b></span>`).join("");
    const head = `<th>ID</th>${lessons.map(l => `<th>L${esc(l.id)}</th>`).join("")}<th>Part 1</th><th>Part 2</th><th>Unit</th>`;
    const body = shown.map(r => `<tr>${idCell(r)}${lessons.map(l => { const s = r.per[l.id]; return `<td>${fmt(s ? s.score : null)}${s && s.late ? `<span class="latemark" title="${s.late} finished after the due date" aria-label="${s.late} finished late">●</span>` : ""}</td>`; }).join("")}` +
      `<td><b>${fmt(r.p1)}</b></td><td><b>${fmt(r.p2)}</b></td><td class="ucell ${r.unit === null ? "" : levelOf(r.unit).key}">${r.unit === null ? "" : lvIcon(levelOf(r.unit).key)}<b>${fmt(r.unit)}</b></td></tr>`).join("");
    const foot = `<tfoot><tr class="avg"><td class="idc">Avg</td>${lessons.map(l => `<td>${fmt(avg(r => lessonScore(r, l)))}</td>`).join("")}<td>${fmt(avg(r => r.p1))}</td><td>${fmt(avg(r => r.p2))}</td><td>${fmt(avg(r => r.unit))}</td></tr></tfoot>`;
    const lw = (42 / lessons.length).toFixed(2);
    table = `<table class="ttable fit unitgrid">${cgroup([13, ...lessons.map(() => lw), 11, 11, 23])}<thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table>`;
    grid = [["Block","HW ID",...lessons.map(l => `Lesson ${l.id} %`),"Part 1 %","Part 2 %","Unit %","Level"],
      ...shown.map(r => [r.period, r.id, ...lessons.map(l => { const v = lessonScore(r, l); return v === null ? "" : v; }),
        r.p1 === null ? "" : r.p1, r.p2 === null ? "" : r.p2, r.unit === null ? "" : r.unit, r.unit === null ? "" : levelOf(r.unit).label])];
    fname = `math3-unit${unit}-grades-${bTag}.csv`;
    extra = `<p class="tnote2">A red <span class="latemark">●</span> beside a lesson score means some of that lesson was finished after its due date.</p>`;

  } else {
    // ---------- STANDARDS MASTERY (one block at a time) ----------
    const cols = Object.keys(STD).filter(code => shown.some(r => r.std[code] && r.std[code].n > 0));
    title = `Block ${esc(S.tBlock)} · Standards mastery`;
    chips = keyChips;
    const hbtn = code => `<button class="stdh ${STD[code].review ? "rev" : ""}" data-std="${esc(code)}" title="${esc(stdTip(unit, code))}" aria-label="${esc(code)}, show details">${esc(STD[code].short)}</button>`;
    const cell = (x, code) => {
      if(!x || x.n === 0) return `<td class="stdc muted" title="Not assigned">—</td>`;
      if(x.score === null) return `<td class="stdc muted" title="No finished problems yet">—</td>`;
      const k = levelOf(x.score).key;
      return `<td class="stdc stdcell ${k}" title="${esc(code)}: ${x.score}% on ${x.done} of ${x.n} problems">${lvIcon(k)}<b>${x.score}%</b></td>`;
    };
    const head = `<th>ID</th>${cols.map(c => `<th>${hbtn(c)}</th>`).join("")}`;
    const body = shown.map(r => `<tr>${idCell(r)}${cols.map(c => cell(r.std[c], c)).join("")}</tr>`).join("");
    const colAvg = c => avg(r => r.std[c] && r.std[c].score !== null ? r.std[c].score : null);
    const foot = `<tfoot><tr class="avg"><td class="idc">Avg</td>${cols.map(c => { const v = colAvg(c); return v === null ? `<td>—</td>` : `<td class="stdcell ${levelOf(v).key}">${lvIcon(levelOf(v).key)}<b>${v}%</b></td>`; }).join("")}</tr></tfoot>`;
    const idw = cols.length > 7 ? 10 : 22;
    table = `<table class="ttable fit stdgrid ${cols.length > 7 ? "many" : ""}">${cgroup([idw, ...cols.map(() => ((100 - idw) / cols.length).toFixed(2))])}<thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table>`;
    extra = `<h2 class="vtitle" style="margin-top:22px">Breakdown by standard</h2>
      <div class="tscroll"><table class="ttable fit"><thead><tr><th>Standard</th>${LEVELS.map(L => `<th>${lvIcon(L.key)}${L.label}</th>`).join("")}</tr></thead><tbody>${cols.map(c =>
        `<tr><td class="idc">${hbtn(c)}</td>${LEVELS.map(L => `<td>${shown.filter(r => r.std[c] && r.std[c].score !== null && levelOf(r.std[c].score).key === L.key).length}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    grid = [["Block","HW ID",...cols.map(c => `${c} %`),...cols.map(c => `${c} Level`)],
      ...shown.map(r => [r.period, r.id, ...cols.map(c => r.std[c] && r.std[c].score !== null ? r.std[c].score : ""),
        ...cols.map(c => r.std[c] && r.std[c].score !== null ? levelOf(r.std[c].score).label : "")])];
    fname = `math3-unit${unit}-standards-${bTag}.csv`;
    extra += miscSection(shown);
  }

  const blockBtn = bk => BLOCK_IMG[bk]
    ? `<button class="blk ${S.tBlock === bk ? "sel" : ""}" data-blk="${esc(bk)}" aria-pressed="${S.tBlock === bk}" aria-label="Block ${esc(bk)}"><img src="${BLOCK_IMG[bk]}" alt=""></button>`
    : `<button class="pill ${S.tBlock === bk ? "sel" : ""}" data-blk="${esc(bk)}" aria-pressed="${S.tBlock === bk}" title="Your test student. Not counted in any class numbers.">${bk === "0" ? "Block 0 · test" : "Block " + esc(bk)}</button>`;

  app.innerHTML = `<div class="tview sec-${sec}">` + teacherHeader() + unitBar() + `
    <div class="lrow tabs">
      <button class="pill ${sec === "lesson" ? "sel" : ""}" data-sec="lesson">Lesson data analysis</button>
      <button class="pill ${sec === "unit" ? "sel" : ""}" data-sec="unit" ${isAll ? "disabled title=\"Pick a block\"" : ""}>Unit grade calculation</button>
      <button class="pill ${sec === "standards" ? "sel" : ""}" data-sec="standards" ${isAll ? "disabled title=\"Pick a block\"" : ""}>Standards mastery</button>
    </div>
    ${sec === "lesson" ? `<div class="lrow tabs">${lessons.map(l => l.problems.length
        ? `<button class="pill ${lv && lv.id === l.id ? "sel" : ""}" data-lesson="${esc(l.id)}">Lesson ${esc(l.id)}</button>`
        : `<button class="pill" disabled title="Not built yet">Lesson ${esc(l.id)}</button>`).join("")}</div>` : ""}
    <h2 class="vtitle">${title}</h2>
    ${chips ? `<div class="lrow">${chips}</div>` : ""}
    <div class="blocks">${blocks.filter(bk => bk !== "0").map(blockBtn).join("")}<button class="pill allbtn ${isAll ? "sel" : ""}" data-blk="all" aria-pressed="${isAll}">All blocks</button></div>
    <div class="tscroll">${table}</div>
    ${extra}
    <div class="lrow" style="margin-top:16px">
      <button class="pill unit" id="tcopy" ${S.sample ? 'disabled title="Turn off sample data to copy real numbers"' : ""}>Copy for gradebook</button>
      ${downloadsCap ? `<button class="pill unit" id="tdl" ${S.sample ? 'disabled title="Turn off sample data to download real numbers"' : ""}>Download CSV</button>` : ""}
    </div>
    <div id="tbox">${S.tBox || ""}</div>
    <div id="stdmodal" class="modal" hidden></div>${sampleNote()}</div>`;

  bindChrome();
  app.querySelectorAll("[data-blk]").forEach(b => b.onclick = () => tGo({block: b.dataset.blk}));
  app.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => { if(!b.disabled) tGo({section: b.dataset.sec}); });
  app.querySelectorAll("[data-lesson]").forEach(b => b.onclick = () => tGo({lesson: b.dataset.lesson}));
  app.querySelectorAll("[data-std]").forEach(b => b.onclick = () => openStd(b.dataset.std, b.dataset.std));
  const modal = document.getElementById("stdmodal");
  modal.onclick = e => { if(e.target === modal) closeStd(); };
  document.onkeydown = e => { if(e.key === "Escape") closeStd(); };

  document.getElementById("tcopy").onclick = async () => {
    const text = toTSV(grid);
    try{ await navigator.clipboard.writeText(text); S.tBox = `<p class="notice ok">Copied. Paste it into your spreadsheet.</p>`; }
    catch(e){ S.tBox = `<p class="muted small">Your browser blocked copying. Select the text below, copy it, and paste into your spreadsheet.</p><textarea class="tsv" readonly rows="6">${esc(text)}</textarea>`; }
    document.getElementById("tbox").innerHTML = S.tBox;
    const ta = document.querySelector("#tbox textarea"); if(ta){ ta.focus(); ta.select(); }
  };
  const dl = document.getElementById("tdl");
  if(dl) dl.onclick = async () => {
    try{ await downloadsCap.save({filename: fname, data: toCSV(grid)}); S.tBox = `<p class="notice ok">Saved ${esc(fname)}.</p>`; }
    catch(e){ S.tBox = e && e.code === "declined" ? "" : `<p class="notice">The download didn’t go through. Use “Copy for gradebook” instead.</p>`; }
    document.getElementById("tbox").innerHTML = S.tBox;
  };
}

function banner(l){
  const s = summary(l);
  document.getElementById("banner").innerHTML = s.n && s.done===s.n
    ? `<div class="banner">🎉 Lesson complete! You finished ${s.n} problems with ${s.acc}% accuracy.</div>` : "";
}

render();
</script>
</body>
</html>
