<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --text:#111111; --ink:#111111; --muted:#555b66;
  --unit:#9FC5E8; --lesson:#F6B26B; --good:#B6D7A8; --bad:#F8C3BB; --hint:#FDEBD3;
  --err:#b3261e; --curve:#0097A7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14161b; --surface:#1c1f26; --text:#f2f2f2; --ink:#f2f2f2; --muted:#a9afbb;
    --unit:#2f4a6b; --lesson:#6b4a22; --good:#3a5a36; --bad:#6b3a3a; --hint:#5a4630;
    --err:#ff8a80; --curve:#4fd0dd;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14161b; --surface:#1c1f26; --text:#f2f2f2; --ink:#f2f2f2; --muted:#a9afbb;
  --unit:#2f4a6b; --lesson:#6b4a22; --good:#3a5a36; --bad:#6b3a3a; --hint:#5a4630;
  --err:#ff8a80; --curve:#4fd0dd;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 70px}
button{font:inherit;color:var(--text);cursor:pointer}

/* pills */
.pill{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:999px;background:var(--surface);padding:8px 18px;text-transform:uppercase;font-weight:500;font-size:.92rem;letter-spacing:.02em;white-space:nowrap}
button.pill:hover{filter:brightness(.96)}
.pill.unit{background:var(--unit)}
.pill.lesson{background:var(--lesson);min-width:150px}
.pill.sm{padding:3px 12px;font-size:.76rem}
.pill.ghost{border-style:dashed;color:var(--muted);border-color:var(--muted)}
.pill.sel{background:var(--lesson)}
.bub{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;background:var(--surface);font-size:.88rem;padding:0}
.bub.good{background:var(--good)} .bub.bad{background:var(--bad)}

/* layout */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:22px}
header.top .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logout{border:none;background:none;text-decoration:underline;color:var(--muted);font-size:.9rem;padding:4px}
h1{font-size:1.1rem;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.04em}
h2{font-size:1.5rem;margin:0 0 16px}
.muted{color:var(--muted)}
.lrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px}
.units .pill{padding:14px 4px}
.empty{margin-top:20px;color:var(--muted)}

/* login */
.login{max-width:440px;margin:30px auto 0}
.login .teachers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 22px}
.login .teachers .pill{padding:14px 8px}
.login h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;margin:0}
.pin{width:100%;margin:10px 0 6px;padding:13px 20px;font:inherit;font-size:1.1rem;letter-spacing:.3em;text-align:center;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--text)}
.err{color:var(--err);min-height:1.4em;margin:8px 4px 10px;font-size:.92rem;text-align:center}

/* lesson page */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px;margin-bottom:6px;border-bottom:1px solid color-mix(in srgb,var(--ink) 15%,transparent)}
.sticky .lrow{margin:0}
.banner{border:2px solid var(--ink);background:var(--good);border-radius:22px;padding:12px 18px;font-weight:600;margin:12px 0}
.q{border:2px solid var(--ink);border-radius:26px;padding:18px;margin:16px 0;background:var(--surface)}
.q .num{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.q .text{font-size:1.15rem;font-weight:600;margin-bottom:14px}
.choices{display:grid;gap:10px}
.choice{text-align:left;border:2px solid var(--ink);border-radius:20px;background:var(--surface);padding:12px 18px}
.choice:hover:not([disabled]){background:var(--unit)}
.choice.wrong{background:var(--bad);text-decoration:line-through;cursor:default;opacity:.9}
.choice.right{background:var(--good);font-weight:700;cursor:default}
.choice.locked{cursor:default;opacity:.6}
.fb{margin-top:12px;font-size:.95rem;font-weight:500}
.hintbox{margin-top:12px;border:2px solid var(--ink);border-radius:18px;background:var(--hint);padding:10px 14px;font-size:.95rem}
.hintbtn{margin-top:12px}

.q .qextra{margin:0 0 14px;overflow-x:auto}
.graph{width:100%;max-width:420px;display:block;margin:0 auto}
.graph .gl{stroke:var(--muted);opacity:.35;stroke-width:1}
.graph .tl{fill:var(--text);font-size:10px;font-family:inherit}
.graph .ax{stroke:var(--ink);stroke-width:1.6}
.graph .cv{fill:none;stroke:var(--curve);stroke-width:2.5}
table.logtable{border-collapse:collapse;margin:0 auto;font-size:.9rem}
table.logtable td,table.logtable th{border:1px solid var(--ink);padding:5px 10px;text-align:center;white-space:nowrap}
table.logtable th{background:var(--unit);font-weight:600}
.parts{display:grid;gap:10px}
.part,.mrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid transparent;border-radius:18px;padding:4px 6px}
.part.bad,.mrow .slot.bad{border-color:var(--ink)}
.plabel{flex:1 1 220px;min-width:0}
select{font:inherit;color:var(--text);padding:9px 14px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);min-width:150px}
.part.bad select{background:var(--bad)}
.part.good select{background:var(--good);font-weight:600}
.checkbtn{margin-top:14px;padding:10px 26px}
.checkbtn[disabled]{opacity:.45;cursor:default}
.slot{min-width:130px;border:2px dashed var(--ink);border-radius:999px;background:var(--surface);padding:9px 14px;color:var(--muted)}
.slot.filled{border-style:solid;color:var(--text);background:var(--unit)}
.slot.bad{background:var(--bad);border-style:solid;color:var(--text)}
.slot.good{background:var(--good);border-style:solid;color:var(--text);font-weight:600}
.slot.over{background:var(--hint)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding:12px;border:2px dashed var(--muted);border-radius:18px}
.chip{border:2px solid var(--ink);border-radius:999px;background:var(--lesson);padding:7px 16px;cursor:grab}
.chip.sel{outline:3px solid var(--text);outline-offset:2px}
.tip{font-size:.85rem;color:var(--muted);margin:0 0 6px}
.lesson-title{margin:2px 0 14px;font-weight:600;font-size:1.15rem}
footer.attr{margin-top:40px;font-size:.75rem;color:var(--muted);text-align:center}
@media (max-width:480px){
  .units{gap:8px}
  .units .pill{font-size:.76rem;padding:13px 2px}
  .pill.lesson{min-width:0}
  .bub{width:38px;height:38px;font-size:.8rem}
}

/* ---- homepage look ---- */
.login{max-width:560px;margin:10px auto 0;text-align:center;text-transform:uppercase;letter-spacing:.05em}
.ransom{display:flex;justify-content:center;align-items:center;gap:5px;margin:4px 0 30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.28));font-size:1rem}
.rn{display:inline-block;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:800;text-transform:none;letter-spacing:0;font-size:clamp(2.8rem,13vw,4.6rem);line-height:1;padding:.1em .17em .14em}
.r1{background:#b9db8f;color:#2f7a2b;transform:rotate(-4deg);clip-path:polygon(2% 8%,97% 0,100% 93%,5% 100%)}
.r2{background:#e9a3b7;color:#b3262c;transform:rotate(5deg) translateY(5px);clip-path:polygon(0 3%,93% 0,100% 98%,6% 95%)}
.r3{background:#f7ebc8;color:#4aa0a6;transform:rotate(-3deg) translateY(-3px);clip-path:polygon(4% 0,100% 5%,96% 100%,0 94%)}
.r4{background:#f0bfd0;color:#3f8a52;transform:rotate(3deg) translateY(2px);clip-path:polygon(0 6%,96% 0,100% 95%,4% 100%)}
.r5{background:#c9c8ee;color:#8a2a3a;transform:rotate(-5deg) translateY(4px);clip-path:polygon(3% 2%,100% 0,95% 100%,0 96%)}
.login .teachers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 26px}
.login .teachers .pill{padding:7px 2px;font-size:clamp(.95rem,4vw,1.25rem);font-weight:400;letter-spacing:.06em}
.login .teachers .pill.sel{background:var(--unit)}
.idlabel{display:block;margin:0 0 8px;font-weight:400;font-size:1.2rem}
.login .pin{display:block;width:100%;max-width:270px;margin:0 auto;padding:9px 18px;font-family:inherit;font-size:1.2rem;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--muted);border-radius:999px;background:var(--surface);color:var(--text);text-align:center}
.login .pin::placeholder{color:var(--muted)}
.login .pin:focus{outline:none;border-color:var(--ink)}
.idhelp{margin:22px 0 0;font-size:1.05rem;line-height:1.4}
.login .err{font-family:inherit;text-transform:none;letter-spacing:0;min-height:1.4em;margin:12px 0 6px}
.login .go{padding:7px 36px;font-size:1.25rem;font-weight:400;letter-spacing:.08em;background:var(--unit)}

/* ---- fonts: Poppins for text, Playfair Display for titles ---- */
h1,h2,h3,.lesson-title{font-family:"Playfair Display",Georgia,serif;font-weight:700;text-transform:none;letter-spacing:0}
header.top h1{font-size:1.5rem}
.lesson-title{font-size:1.3rem}
.login{letter-spacing:.02em}
.login .teachers .pill{padding:9px 2px;font-size:clamp(.62rem,2.9vw,.9rem);font-weight:500;letter-spacing:.02em}
.idlabel{font-size:.95rem;font-weight:500}
.login .pin{font-size:1rem;letter-spacing:.06em}
.idhelp{font-size:.85rem;font-weight:500}
.login .go{font-size:1rem;font-weight:500;letter-spacing:.04em}

/* ---- all buttons use Playfair Display ---- */
button,.pill,.bub,.choice,.chip,.slot,.checkbtn,.logout{font-family:"Playfair Display",Georgia,serif;font-variant-numeric:lining-nums}
h1,h2,h3,.lesson-title{font-variant-numeric:lining-nums}
.pill,.login .teachers .pill,.login .go{font-weight:600}
.choice{font-weight:500}
.choice.right{font-weight:700}
.bub{font-weight:600}
.logout{font-weight:500}

/* ---- problem status colors ---- */
:root{--s-done:#B6D7A8;--s-prog:#F9D48B;--s-todo:#F28B82}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s-done:#3a5a36;--s-prog:#6e5a22;--s-todo:#7a3a38}}
:root[data-theme="dark"]{--s-done:#3a5a36;--s-prog:#6e5a22;--s-todo:#7a3a38}
.bub.done{background:var(--s-done)}
.bub.prog{background:var(--s-prog)}
.bub.todo{background:var(--s-todo)}
button.bub{cursor:pointer;transition:transform .1s}
button.bub:hover{transform:translateY(-2px)}
button.bub:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:2px 0 18px;font-size:.82rem}
.legend .dot{display:inline-block;width:15px;height:15px;border-radius:50%;border:2px solid var(--ink);margin-right:-6px}
.legend .dot.done{background:var(--s-done)} .legend .dot.prog{background:var(--s-prog)} .legend .dot.todo{background:var(--s-todo)}
.legend-tip{color:var(--muted);flex-basis:100%}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}

/* ---- accuracy pill, teacher box, dashboard ---- */
.pill.acc{background:var(--surface)}
.tbox{max-width:300px;margin:34px auto 0;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--ink) 22%,transparent)}
.tlabel{font-size:.74rem;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.1em}
.trow{display:flex;gap:8px;justify-content:center}
.tcode{flex:1;min-width:0;padding:7px 14px;border:2px solid var(--muted);border-radius:999px;background:var(--surface);color:var(--text);font:inherit;font-size:.88rem;text-align:center;letter-spacing:.06em}
.tcode:focus{outline:none;border-color:var(--ink)}
.tlabel2{display:block;font-size:.8rem;font-weight:600;margin:6px 0 6px}
.tasg{width:100%;max-width:520px;margin-bottom:14px}
.tabs .pill.sel{background:var(--unit)}
.notice{border:2px solid var(--ink);border-radius:18px;background:var(--hint);padding:9px 14px;margin:0 0 16px;font-size:.88rem}
.notice.ok{background:var(--s-done);margin:12px 0 0}
.small{font-size:.8rem}
.tscroll{overflow-x:auto;border:2px solid var(--ink);border-radius:20px;background:var(--surface)}
table.ttable{border-collapse:collapse;width:100%;min-width:480px}
.ttable th{font-family:"Playfair Display",Georgia,serif;font-size:.95rem;text-align:left;padding:10px 14px;border-bottom:2px solid var(--ink);background:var(--unit);white-space:nowrap}
.ttable th small{display:block;font-family:"Poppins",system-ui,sans-serif;font-weight:400;font-size:.7rem;color:var(--text);opacity:.8}
.ttable td{padding:10px 14px;border-bottom:1px solid color-mix(in srgb,var(--ink) 18%,transparent);vertical-align:middle;font-size:.9rem}
.ttable tbody tr:last-child td{border-bottom:none}
.cell{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:.85rem;white-space:nowrap}
.cell.done{background:var(--s-done)} .cell.prog{background:var(--s-prog)} .cell.todo{background:var(--s-todo)}
textarea.tsv{width:100%;margin-top:6px;border:2px solid var(--ink);border-radius:14px;padding:10px;font:inherit;font-size:.8rem;background:var(--surface);color:var(--text)}

/* ---- mastery levels + dashboard polish ---- */
:root{--s-exceed:#D7B5DB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s-exceed:#55406a}}
:root[data-theme="dark"]{--s-exceed:#55406a}
.lvl{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:3px 13px;font-size:.82rem;white-space:nowrap;background:var(--surface)}
.lvl b{margin-left:4px}
.lvl.exceeds{background:var(--s-exceed)} .lvl.mastery{background:var(--s-done)}
.lvl.near{background:var(--s-prog)} .lvl.remed{background:var(--s-todo)}
.pill[disabled]{opacity:.45;border-style:dashed;cursor:default}
.vtitle{font-size:1.25rem;margin:14px 0 10px}
.sid{font-weight:500;letter-spacing:.04em}
table.ttable.wide{min-width:820px}
.ttable tfoot td{border-top:2px solid var(--ink);background:color-mix(in srgb,var(--unit) 55%,transparent);font-weight:600}
.tabs{margin-bottom:10px}

/* ---- block buttons (paper cutouts) ---- */
.blocks{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;margin:0 0 4px}
.blk{border:none;background:none;padding:0;cursor:pointer;opacity:.6;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.3));transition:transform .15s,opacity .15s,filter .15s}
.blk img{display:block;height:92px;width:auto}
.blk:nth-child(1){transform:rotate(-2.5deg)}
.blk:nth-child(2){transform:rotate(1.5deg)}
.blk:nth-child(3){transform:rotate(-1deg)}
.blk:hover{opacity:.9}
.blk::after{content:"";display:block;height:3px;margin:7px 4px 0;border-radius:2px;background:transparent}
.blk.sel{opacity:1;transform:translateY(-4px) rotate(0deg) scale(1.07);filter:drop-shadow(0 5px 4px rgba(0,0,0,.35))}
.blk.sel::after{background:var(--ink)}
.blk:focus-visible{outline:3px solid var(--text);outline-offset:4px}
.blkhint{font-size:.8rem;color:var(--muted);margin:2px 0 16px}
.calc{border:2px solid var(--ink);border-radius:18px;padding:10px 16px;margin:0 0 14px;background:var(--surface);font-size:.92rem}
.ttable tr.hl td{background:color-mix(in srgb,var(--unit) 38%,transparent)}
@media (max-width:480px){.blk img{height:76px}.blocks{gap:12px}}

/* ---- teacher view: simple, Poppins, fits the screen ---- */
.tview button,.tview .pill,.tview .logout,.tview th,.tview h2{font-family:"Poppins",system-ui,sans-serif;font-variant-numeric:normal;letter-spacing:0}
.tview .pill{text-transform:none;font-weight:500;font-size:.88rem}
.tview .pill.sm{font-size:.75rem}
.tview h2{font-weight:600;font-size:1.05rem}
.tnote{font-size:.76rem;color:var(--muted);margin:0 0 14px}
.livedot{color:#0097A7;font-size:.7em;vertical-align:middle}
.tview .blocks{align-items:center;gap:14px;margin:0 0 14px}
.tview .blk::after{margin-top:6px}
.tview .tabs{margin-bottom:10px}
.tview .tscroll{overflow:hidden}
.tview table.ttable.fit{width:100%;min-width:0;table-layout:fixed}
.fit th,.fit td{padding:7px 2px;text-align:center;font-size:.76rem;line-height:1.25;word-wrap:break-word}
.fit th{font-weight:600;font-size:.72rem;white-space:normal}
.fit th:first-child,.fit td.idc{text-align:left;padding-left:9px;width:18%}
.fit .sid{font-weight:500;letter-spacing:.03em}
.fit td.basis{font-weight:700}
.fit .cell{padding:1px 6px;font-size:.72rem;white-space:nowrap}
.fit .lvl{padding:2px 7px;font-size:.7rem}
.fit td.ucell{border-left:2px solid var(--ink)}
.fit td.ucell.exceeds{background:var(--s-exceed)} .fit td.ucell.mastery{background:var(--s-done)}
.fit td.ucell.near{background:var(--s-prog)} .fit td.ucell.remed{background:var(--s-todo)}
.fit tfoot td{border-top:2px solid var(--ink)}
@media (max-width:480px){.tview .blk img{height:70px}.tview .blocks{gap:10px}.fit th,.fit td{font-size:.68rem;padding:6px 1px}.fit .lvl{font-size:.62rem;padding:2px 5px}}

.tview .tabs .pill{padding:8px 13px}
@media (max-width:480px){.tview .tabs .pill{padding:7px 11px;font-size:.8rem}}
.fit th:first-child,.fit td.idc{width:auto}
.fit td.idc{white-space:nowrap}
.fit.unitgrid th:first-child{width:15%}
.tview .allbtn.sel,.tview .pill.sel{background:var(--unit)}

/* ---- mastery levels: Mastery green, Exceeds blue, Near amber, Remediation red ---- */
:root{--lv-exceeds:#2573DF;--lv-mastery:#27872B;--lv-near:#C08A00;--lv-remed:#ED0000}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lv-exceeds:#5FA0FF;--lv-mastery:#4DB854;--lv-near:#E5B02A;--lv-remed:#FF6B6B}}
:root[data-theme="dark"]{--lv-exceeds:#5FA0FF;--lv-mastery:#4DB854;--lv-near:#E5B02A;--lv-remed:#FF6B6B}
.exceeds{--c:var(--lv-exceeds)} .mastery{--c:var(--lv-mastery)} .near{--c:var(--lv-near)} .remed{--c:var(--lv-remed)}
.lvic{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-right:4px;color:var(--c);flex:none}
.lvic svg{display:block;width:100%;height:100%}
.lvl.exceeds,.lvl.mastery,.lvl.near,.lvl.remed{background:color-mix(in srgb,var(--c) 17%,var(--surface))}
.fit td.ucell.exceeds,.fit td.ucell.mastery,.fit td.ucell.near,.fit td.ucell.remed{background:color-mix(in srgb,var(--c) 17%,var(--surface))}
.fit .lvic{width:11px;height:11px;margin-right:3px;vertical-align:-1px}
.fit.unitgrid th:first-child{width:13%}
.fit.unitgrid td.idc{padding-left:6px}
.fit.unitgrid td.ucell{white-space:nowrap;padding-left:0;padding-right:0}
.ttable th .lvic{margin-right:3px}

/* ---- home (lightbulb), back, standards ---- */
.hl{display:flex;align-items:center;gap:10px}
.homebtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;color:var(--ink);transition:transform .12s}
.homebtn svg{width:25px;height:25px}
.homebtn:hover{transform:translateY(-1px) rotate(-6deg)}
.homebtn:focus-visible,.stdh:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.navrow{margin:-10px 0 14px}
.stdh{font:inherit;font-family:"Poppins",system-ui,sans-serif;font-weight:700;font-size:.74rem;border:none;background:none;color:var(--text);cursor:help;padding:2px 0;text-decoration:underline dotted;text-underline-offset:3px}

/* ============ SLIDE LOOK: colors and boxes from the learning-targets slide ============ */
:root{
  --bg:#F8FAFD;
  --pink:#FF96D4;   --pinkbg:#FFECF9;
  --green:#B6D7A8;  --greenbg:#F2F8EE;
  --orange:#F6B26B; --orangebg:#FEF3E6;
  --blue:#9FC5E8;   --blueborder:#A4C2F4; --bluebg:#EDF4FC;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --pink:#c0679d; --pinkbg:#35232f; --green:#4f7a46; --greenbg:#222f21; --orange:#a8672a; --orangebg:#382a1b; --blue:#3f6a96; --blueborder:#4b78a8; --bluebg:#1d2a38}}

/* student problem cards: blue header bar like the slide's "Tonight's HW" box; hints are the pink box */
.q{--px:18px;--py:18px;padding:var(--py) var(--px);border-color:var(--blueborder);overflow:hidden}
.q .num{margin:calc(var(--py) * -1) calc(var(--px) * -1) 14px;padding:10px var(--px);background:var(--blue);border-bottom:2px solid var(--blueborder);color:var(--text);font-weight:700;letter-spacing:.07em}
.hintbox{background:var(--pinkbg);border:2px solid var(--pink)}
.notice{background:var(--orangebg);border-color:var(--orange)}
.notice.ok{background:var(--greenbg);border-color:var(--green)}
@media (min-width: 900px){
  .q{--px:30px;--py:22px}
  .side{background:var(--surface);border:2px solid var(--green);border-radius:22px;padding:16px}
}

/* teacher pages: centered, one color per section */
.tview{text-align:center;--sec:var(--blue);--secb:var(--blueborder)}
.tview.sec-lesson{--sec:var(--green);--secb:var(--green)}
.tview.sec-unit{--sec:var(--orange);--secb:var(--orange)}
.tview.sec-standards{--sec:var(--blue);--secb:var(--blueborder)}
.tview [data-sec="lesson"]{--pc:var(--green)}
.tview [data-sec="unit"]{--pc:var(--orange)}
.tview [data-sec="standards"]{--pc:var(--blue)}
.tview .hbtn[data-sec]{background:var(--pc)}
.tview .tabs .pill.sel[data-sec]{background:var(--pc)}
.tview .pill.sel,.tview .allbtn.sel{background:var(--sec)}
.tview .tscroll{border-color:var(--secb);margin-left:auto;margin-right:auto}
.tview .ttable thead th{background:var(--sec)}
.tview .ttable tfoot td{background:color-mix(in srgb,var(--sec) 30%,var(--surface))}
.tview .lrow,.tview .blocks,.tview .tabs{justify-content:center}
.tview .fit td.idc,.tview .fit th:first-child{text-align:center;padding-left:6px}
.tview .vtitle,.tview h2{font-family:"Playfair Display",Georgia,serif;font-weight:700;text-align:center;letter-spacing:0}
.tview .vtitle{font-size:1.7rem;margin:4px 0 14px}

/* teacher header: bulb + Teacher home on the left, title in the middle, name on the right */
.thead{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px}
.thead .tl{display:flex;flex-direction:column;align-items:flex-start;gap:8px}

.ctrlrow{justify-content:center}

/* teacher home: slide-style boxes */
.hstats{max-width:1020px;margin:0 auto 14px}

.hstat .hhead{background:var(--cardc);padding:7px 10px;font-weight:700;font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}

.hstat .hbar{margin-top:8px}
.hstat.s1{--cardc:var(--blue)} .hstat.s2{--cardc:var(--green)} .hstat.s3{--cardc:var(--orange)} .hstat.s4{--cardc:var(--pink)}

/* ---- student unit buttons: the paper-cutout numerals ---- */
.units{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:18px 20px;margin-top:clamp(18px,7vh,70px)}

.ubtn img{display:block;height:84px;width:auto}
.ubtn:nth-child(4n+1){transform:rotate(-3deg)}
.ubtn:nth-child(4n+2){transform:rotate(2deg)}
.ubtn:nth-child(4n+3){transform:rotate(-1.5deg)}
.ubtn:nth-child(4n+4){transform:rotate(3deg)}
.ubtn:hover{transform:translateY(-6px) rotate(0deg) scale(1.07);filter:drop-shadow(0 7px 5px rgba(0,0,0,.3))}
.ubtn:focus-visible{outline:3px solid var(--text);outline-offset:5px;border-radius:6px}

/* ============ new problem parts, graphs, student nav band, countdown ============ */
:root{--curve2:#D9732A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--curve2:#f0a060}}
:root[data-theme="dark"]{--curve2:#f0a060}
.graph .cv2{stroke:var(--curve2)}
.graph .lab{font-weight:700;font-size:12px;fill:var(--curve)}
.graph .lab2{fill:var(--curve2)}
.graph .pt{fill:var(--text)}

/* answer parts shown as buttons */
.part.pb{display:block}
.part.pb .plabel{display:block;margin-bottom:6px;font-weight:500}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.optb{border:2px solid var(--ink);border-radius:16px;background:var(--surface);padding:8px 14px;font-size:.98rem;line-height:1.3;text-align:left;cursor:pointer}
.optb:hover:not([disabled]){background:var(--unit)}
.optb.on{background:var(--unit);font-weight:600}
.part.pb.bad .optb.on{background:var(--bad)}
.part.pb.good .optb.on{background:var(--good);font-weight:700}
.part.pb.good .optb:not(.on){opacity:.45}
.part.pb.bad,.part.pb.good{border-radius:18px}
@media (min-width: 900px){
  .parts.two{grid-template-columns:1fr 1fr;gap:12px 28px}
  .parts.two .part.pb{padding:6px 8px}
}

/* student Back / Home, the unit numeral, and the due date */
.navstack{display:flex;flex-direction:column;gap:10px}
.navpill{font-family:"Poppins",system-ui,sans-serif;padding:9px 28px;font-size:.86rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.navpill.sel{background:var(--surface);transform:translateY(-2px);box-shadow:0 4px 0 var(--ink)}
.sband{display:flex;align-items:center;justify-content:center;gap:26px;margin:0 0 14px;flex-wrap:wrap}
.sband.sb-units{align-items:flex-start;justify-content:flex-start;flex-wrap:nowrap}
.sb-units .ucol{flex:1;min-width:0}
.unitpic{display:block;height:clamp(84px,17vh,128px);width:auto;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.unitpic.sm{height:78px}
.sidetop{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.due{--dc:var(--orange);border:2px solid var(--dc);border-radius:18px;background:var(--surface);overflow:hidden;min-width:210px;text-align:center}
.due.late{--dc:var(--s-todo)}
.due .dhead{background:var(--dc);padding:6px 12px;font-family:"Poppins",system-ui,sans-serif;font-weight:700;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.due .dbody{padding:8px 14px 10px}
.due .dcount{display:flex;justify-content:center;gap:16px}
.due .dcount span{display:flex;flex-direction:column;align-items:center;font-family:"Poppins",system-ui,sans-serif;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.due .dcount b{font-family:"Playfair Display",Georgia,serif;font-size:1.9rem;line-height:1.1;color:var(--text);font-variant-numeric:lining-nums}
.due .dnote{font-family:"Poppins",system-ui,sans-serif;font-size:.76rem;color:var(--muted);margin-top:2px}
.due.mini{min-width:0;padding:8px 12px;text-align:left;border-radius:16px;margin-top:12px;font-family:"Poppins",system-ui,sans-serif;font-size:.86rem}
.due.mini b{font-size:1rem}
.due.mini small{display:block;color:var(--muted);font-size:.74rem}
.dueline{text-align:center;margin:14px 0 0;font-family:"Poppins",system-ui,sans-serif;font-size:.95rem}
.dueline.late b{color:var(--err)}
.bubs.many .bub{width:42px;height:42px;font-size:.86rem}
@media (min-width: 900px){
  .side{max-height:calc(100vh - 48px);overflow:auto}
  body[data-view="unit"] .bubs.many .bub{width:42px;height:42px}
}
@media (max-width: 700px){
  .sband.sb-units{flex-wrap:wrap}
  .sb-units .navstack{flex-direction:row;margin-bottom:6px}
  .navpill{padding:8px 20px}
  .unitpic{height:84px}
  .stdgrid.many .stdcell b{display:none}
}

/* ---- tighter student pages so they still fit a Chromebook ---- */
.bubs.many{gap:6px}
.bubs.many .bub{width:38px;height:38px;font-size:.8rem}
.due .dhead{padding:5px 10px}
.due .dbody{padding:6px 12px 8px}
.due .dcount b{font-size:1.6rem}
@media (min-width: 900px){
  .unitpic{height:clamp(72px,13vh,100px)}
  .sband{margin-bottom:6px}
  .legend{margin:0 0 10px}
  .side{padding:12px 14px}
  .sidetop{margin-bottom:8px;gap:12px}
  .side .navstack{gap:8px}
  .side .navpill{padding:7px 18px;font-size:.78rem}
  .unitpic.sm{height:68px}
  .side .lesson-title{margin:2px 0 8px;font-size:1.1rem}
  .side .lrow{margin-bottom:10px;gap:8px}
  .due.mini{margin-top:8px;padding:6px 10px}
}

@media (min-width: 900px){
  .legend-tip{flex-basis:auto;margin-left:14px}
  body[data-view="unit"] .lrow{margin-bottom:9px}
  body[data-view="unit"] footer.attr{margin-top:14px}
}

/* wide problems: graph beside the question, parts underneath across the full width */
.q{overflow:hidden;overflow:clip}
@media (min-width: 900px){
  .q.withside.wide{grid-template-areas:"num num" "text graph" "body body"}
  .q.withside.wide .parts.two .part:not(.pb){align-self:end}
}

@media (min-width: 900px){
  .parts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .parts.two > .part{min-width:0}
  .parts.two > .part.span2{grid-column:1 / -1}
}

/* phones: a wide standards table scrolls sideways inside its own box instead of squeezing */
@media (max-width: 700px){
  .tview .tscroll{overflow-x:auto}
  .stdgrid.many{min-width:760px}
}

@media (max-width: 700px){
  .part{flex-wrap:wrap}
  .part .plabel{flex:1 1 100%}
  .part select{flex:1 1 100%;min-width:0;max-width:100%}
  .optb{max-width:100%}
  .tview .ttable.stdgrid.many{min-width:760px}
}

@media (max-width: 700px){
  .parts{grid-template-columns:minmax(0,1fr)}
  .part select{width:100%}
  .q .logtable{display:block;max-width:100%;overflow-x:auto}
}

/* a note inside a problem */
.q .qnote{display:block;margin-top:10px;padding:8px 12px;border-radius:12px;background:var(--orangebg);border:2px solid var(--orange);font-weight:500;font-size:.92rem;line-height:1.4}
.q .qnote b{font-weight:700}

/* a part that was right on the last check turns green, one that was wrong turns red */
.part.right select{background:var(--good);font-weight:600}
.part.pb.right .optb.on{background:var(--good);font-weight:700}
.mrow .slot.right{background:var(--good);border-style:solid;color:var(--text);font-weight:600}
.part.right,.part.bad{border-radius:18px}

/* ---- common misconceptions (Standards mastery) ---- */
.tnote2{margin:-6px 0 12px;font-size:.84rem;color:var(--muted)}
.misclist{list-style:none;margin:0 auto;padding:0;max-width:1020px;display:grid;gap:12px;text-align:left}
.misc{border:2px solid var(--secb);border-radius:18px;background:var(--surface);padding:12px 16px}
.mhead{display:flex;align-items:center;gap:14px}
.mrank{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--sec);display:inline-flex;align-items:center;justify-content:center;font-family:"Playfair Display",Georgia,serif;font-weight:700}
.mtext{flex:1;min-width:0}
.mtext b{display:block;font-size:1rem;font-weight:600}
.meg{display:block;font-size:.84rem;color:var(--muted);margin-top:2px}
.mcount{flex:none;text-align:right;font-size:.8rem;color:var(--muted);line-height:1.25}
.mcount b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:1.6rem;line-height:1;color:var(--text);font-weight:700}
.mcount small{display:block;font-size:.78rem}
.mwhere{margin:8px 0 6px 48px;font-size:.8rem;color:var(--muted)}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-left:48px}
.mchip{border:1.5px solid var(--ink);border-radius:999px;padding:2px 10px;font-size:.8rem;background:var(--surface)}
.mchip.live::after{content:"●";color:#0097A7;margin-left:5px;font-size:.7rem}
@media (max-width: 700px){
  .mwhere,.mchips{margin-left:0}
  .mhead{flex-wrap:wrap}
  .mcount{text-align:left}
}

/* sample-data switch and warnings */
.sampletog{font-size:.74rem;padding:5px 12px;letter-spacing:.02em}
.sampletog.on{background:var(--orange);font-weight:700}
.tview p.tnote.samplewarn{background:var(--orangebg);border:2px solid var(--orange);border-radius:14px;padding:8px 14px;color:var(--text);max-width:900px;margin:14px auto 0}
.emptyhome{max-width:820px;margin:6px auto 4px;line-height:1.5;text-align:center}
@media (max-width: 700px){ .thead .tr{flex-wrap:wrap;justify-content:flex-end} }

/* the test student, at the bottom of All blocks */
.ttable .testsep td{background:var(--orangebg);color:var(--muted);font-size:.78rem;text-align:center;border-top:2px solid var(--ink);padding:6px 8px}

.idnote{margin:8px auto 0;max-width:430px;font-size:.84rem;line-height:1.35;color:var(--muted);text-align:center}
.idnote b{color:var(--text);font-weight:600}
.idnote{text-transform:none;letter-spacing:0}

/* many standards: a slightly tighter grid so all the columns fit */
@media (min-width: 900px){
  .tview .ttable.stdgrid.many{font-size:.8rem}
  .tview .ttable.stdgrid.many th,.tview .ttable.stdgrid.many td{padding-left:2px;padding-right:2px}
  .tview .ttable.stdgrid.many .stdcell{gap:3px}
}

/* wide standards grid gets a little more room */
@media (min-width: 900px){
  .tview .tscroll:has(.stdgrid.many){max-width:1116px}
  .tview .ttable.stdgrid.many .lvic{width:12px;height:12px;margin-right:2px}
}
/* unit page: seven lessons still fit a Chromebook screen */
@media (min-width: 900px){
  body[data-view="unit"] .wrap{padding-top:14px}
  body[data-view="unit"] .lrow{margin-bottom:6px}
  body[data-view="unit"] .bub{width:42px;height:42px;font-size:.9rem}
  body[data-view="unit"] .bubs.many .bub{width:38px;height:38px;font-size:.8rem}
  body[data-view="unit"] .due.ok .dnote,body[data-view="unit"] .due.soon .dnote{display:none}
  body[data-view="unit"] .due .dcount b{font-size:1.45rem}
  body[data-view="unit"] .unitpic{height:clamp(66px,11vh,90px)}
  body[data-view="unit"] footer.attr{margin-top:8px}
}

@media (min-width: 900px){
  body[data-view="unit"] .wrap{padding-top:10px}
  body[data-view="unit"] .lrow{margin-bottom:4px}
  body[data-view="unit"] .bub{width:40px;height:40px;font-size:.88rem}
  body[data-view="unit"] .bubs.many .bub{width:36px;height:36px;font-size:.78rem}
  body[data-view="unit"] .due .dhead{padding:4px 10px}
  body[data-view="unit"] .due .dbody{padding:4px 12px 6px}
  body[data-view="unit"] .sband{margin-bottom:4px}
  body[data-view="unit"] .legend{margin-bottom:6px}
}

@media (min-width: 900px){
  body[data-view="unit"] .lrow{margin-bottom:3px}
  body[data-view="unit"] footer.attr{margin-top:4px}
  body[data-view="unit"] .sband{margin-bottom:2px}
}

/* ---- two deadlines, and late work ---- */
.due.p1{--dc:var(--orange)}
.due.p2{--dc:var(--blue)}
.due.late{--dc:var(--s-todo)}
.pill.lesson.p2{background:var(--blue)}
.dueline .dl-u{font-weight:700;margin-right:6px}
.dueline .dl-p{display:inline-block;margin:0 10px}
.dueline .dl-p.late{color:var(--err)}
.q .num .pill.sm.latetag{background:var(--s-todo);border-color:var(--ink);font-weight:700;letter-spacing:.04em}
.bub{position:relative}
.bub.late::after,.dot.latedot::after{content:"";position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--s-todo);border:2px solid var(--ink)}
.dot.latedot{position:relative}
.dot.latedot::after{top:-3px;right:-3px;width:8px;height:8px;border-width:1.5px}
.latecount{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;border:1.5px solid var(--ink);background:var(--s-todo);font-size:.72rem;font-weight:700;vertical-align:1px}
.latemark{color:#b3261e;font-weight:700;margin-left:3px;font-size:.62rem}

@media (min-width: 900px){
  body[data-view="unit"] .due .dnote{font-size:.66rem;line-height:1.05;margin-top:0}
  body[data-view="unit"] .due .dcount b{font-size:1.32rem}
  body[data-view="unit"] .due .dbody{padding-bottom:4px}
}

.latemark{color:#d64545;font-size:.6rem;vertical-align:super;margin-left:3px;font-weight:400}

/* the student's own HW ID, top right */
.myid{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:1.2rem;letter-spacing:.05em;color:var(--curve);margin-right:2px}
.who{flex-wrap:wrap;justify-content:flex-end}

header.top .who{margin-left:auto}

/* ---- backup status ---- */
.bkst{font-size:.76rem;font-weight:600;color:var(--muted);white-space:nowrap;margin-right:2px}
.bkst.ok{color:var(--curve)}
.bkst.offline{color:var(--err)}
.idnote.bknote{margin-top:4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;max-width:90vw;padding:10px 18px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);color:var(--text);font-size:.9rem;box-shadow:0 4px 14px rgba(0,0,0,.18)}

@media (max-width: 480px){
  .bkst{font-size:0;margin-right:0}
  .bkst::before{font-size:1.05rem;line-height:1}
  .bkst.ok::before{content:"✓"} .bkst.saving::before{content:"…"} .bkst.offline::before{content:"!"}
}

/* ---- class data button on the teacher dashboard ---- */
.trbtn{white-space:nowrap}
.trbtn.ok{border-color:var(--curve);color:var(--curve)}
.trbtn.error{border-color:var(--err);color:var(--err)}
.trbtn.loading{opacity:.7}
.tnote.trerr{color:var(--err)}
</style>
</head>

       hint:`Remember that ${LG(10,"x")} is the exponent you put on 10 to get x. To write a log equation as an exponential equation, use ${LG("b","N")} = x ⟺ ${PW("b","x")} = N. For example, ${LG(2,8)} = x becomes ${PW(2,"x")} = 8. For (a), find 400 in the table and read down to its log value. For (d), ask whether 10 raised to that value gives the number exactly, or only after rounding.`},

      {std:["NC.M3.A-CED.2","NC.M3.F-LE.4"], n:"11", type:"mc",
       q:`(Technology required.) A bank account balance, in dollars, is modeled by f(t) = 1,000 · (1.08)<sup>t</sup>, where t is time measured in years. About how many years will it take for the account balance to double?`,
       c:[`t = log<sub>2</sub>(1.08) ≈ 0.11 years`,

          `t = log<sub>1.08</sub>(2) ≈ 9 years`,
          `t = log<sub>10</sub>(1.08) ≈ 0.03 years`], a:2,
       hint:`Doubling means the balance reaches twice its starting amount, so write an equation that sets f(t) equal to that new balance. Get the power ${PW("1.08","t")} by itself first by undoing whatever multiplies it. Then use ${PW("b","y")} = x ⟺ ${LG("b","x")} = y to write t as a logarithm, and evaluate it with technology.`},

      {std:["NC.8.EE.2","NC.M3.F-LE.4"], n:"17", type:"dd",
       q:`Find or estimate the value of each variable mentally.`,
       parts:[

         {t:`d. 5<sup>d</sup> = 625, so d =`, o:["5","4","125","625"], a:1},
         {t:`e. 2<sup>x</sup> = 100, so x =`, b:true, o:[`${LG(10,2)} ≈ 0.3`, `${LG(2,10)} ≈ 3.3`, `${LG(10,100)} = 2`, `${LG(2,100)} ≈ 6.6`], a:3}],
       hint:`Every equation has three parts: a base, an exponent, and a result. The rule ${PW("b","y")} = x ⟺ ${LG("b","x")} = y connects them. In (a) and (d) the exponent is the unknown, so ask “what exponent on this base gives that result?” In (b) and (c) the exponent is already given, so just work out the result. In (e) the unknown exponent isn’t a whole number, so write it as a log and estimate it with technology.`},

      {std:["NC.M3.A-CED.2","NC.M3.F-LE.4"], n:"2H", type:"mc", honors:true,

       c:[`h = log<sub>10</sub>(2) ≈ 0.3 hours`,

          `h = log<sub>2</sub>(10,000) ≈ 13.3 hours`], a:1,

      {std:["NC.M3.A-SSE.3","NC.M2.N-RN.1"], n:"12H", type:"dd", honors:true,
       q:`Decide if each statement is true or false.`,

         {t:`c. 243<sup>1/3</sup> is equivalent to ∛243.`, o:["True","False"], a:0},
         {t:`d. √20 is a solution to m<sup>4</sup> = 20.`, o:["True","False"], a:1}],

    ]},
    { id:"4", title:"Logarithmic Expressions and Equations", problems:[
      {std:[S_LE4], n:"2", type:"dd",
       q:`Here is a logarithmic expression: ${LG(2,64)}.`,
       parts:[
         {t:`(a) How do we say the expression in words?`, b:true, o:[`The log, base 64, of 2`, `The log, base 2, of 64`, `The log of 2, times 64`, `2 to the 64th power`], a:1},
         {t:`(b) In your own words, the expression means`, b:true, o:[`the exponent to use with a base of 64 to get 2`, `the answer when you multiply 2 by 64`, `the exponent to use with a base of 2 to get 64`, `the answer when you raise 2 to the 64th power`], a:2},
         {t:`(c) The value of this expression is`, o:["5","6","32","128"], a:1}],
       hint:`${LG(2,64)} asks, “2 to what exponent equals 64?” Call the unknown exponent x and rewrite it in exponential form as ${PW(2,"x")} = 64. Then count how many 2s multiply together to make 64.`},

      {std:[S_LE4], n:"4", type:"dd",
       q:`Answer the following questions.`,
       parts:[
         {t:`(a) ${LG(2,16)} = 4 written in exponential form is`, b:true, o:[`${PW(4,2)} = 16`, `${PW(2,4)} = 16`, `${PW(16,4)} = 2`, `${PW(2,16)} = 4`], a:1},
         {t:`(b) ${PW(5,"−2")} = 1/25 written in logarithmic form is`, b:true, o:[`${LG("−2",5)} = 1/25`, `${LG("1/25",5)} = −2`, `${LG(5,"1/25")} = −2`, `${LG(5,"−2")} = 1/25`], a:2},
         {t:`(c) ${LG(2,1)} = 0 because`, b:true, o:[`${PW(2,1)} = 2, so the log is 1`, `${PW(2,0)} = 1, so 0 is the exponent that gives 1`, `2 × 0 = 0`, `1 is the smallest number`], a:1}],
       hint:`The rule: ${PW("b","y")} = x means ${LG("b","x")} = y. The base stays the base, and the exponent is the answer to the log. Use it in both directions. For (c), ask what exponent on 2 gives 1.`},

      {std:[S_LE4], n:"5", type:"dd", cols:2,

      {std:[S_LE4], n:"8", type:"dd",
       q:`Without technology, determine between which two whole numbers the value of ${LG(2,6)} is. Explain how you know.`,
       parts:[
         {t:`(a) ${LG(2,6)} is between`, o:["1 and 2","2 and 3","3 and 4","5 and 7"], a:1},
         {t:`(b) How you know`, b:true, o:[`${PW(2,2)} = 4 is less than 6 and ${PW(2,3)} = 8 is greater than 6`, `6 is between 2 and 3 on the number line`, `2 × 3 = 6`, `${PW(2,6)} = 64 is much greater than 6`], a:0}],
       hint:`${LG(2,6)} means ${PW(2,"x")} = 6, where x is the unknown exponent. Find the two whole-number powers of 2 that 6 sits between. The exponents on those powers are your two whole numbers.`},

      {std:[S_LE4], n:"9", type:"dd", cols:2,
       q:`For each exponential equation, write an equivalent equation in logarithmic form.`,
       parts:[
         {t:`a. ${PW(3,4)} = 81`, b:true, o:[`${LG(4,81)} = 3`, `${LG(3,81)} = 4`, `${LG(81,3)} = 4`, `${LG(3,4)} = 81`], a:1},
         {t:`b. ${PW(10,0)} = 1`, b:true, o:[`${LG(10,0)} = 1`, `${LG(1,10)} = 0`, `${LG(10,1)} = 0`, `${LG(0,1)} = 10`], a:2},
         {t:`c. ${PW(4,"1/2")} = 2`, b:true, o:[`${LG(2,4)} = 1/2`, `${LG(4,2)} = 1/2`, `${LG(4,"1/2")} = 2`, `${LG(2,"1/2")} = 4`], a:1},
         {t:`d. ${PW(2,"t")} = 5`, b:true, o:[`${LG(5,2)} = t`, `${LG(2,"t")} = 5`, `${LG(2,5)} = t`, `${LG("t",2)} = 5`], a:2},
         {t:`e. ${PW("m","n")} = C`, b:true, o:[`${LG("n","C")} = m`, `${LG("C","m")} = n`, `${LG("m","n")} = C`, `${LG("m","C")} = n`], a:3}],
       hint:`The rule: ${PW("b","y")} = x becomes ${LG("b","x")} = y. The base stays the base, the exponent becomes the answer to the log, and the result of the power goes inside the log.`},

      {std:[S_LE4], n:"3H", honors:true, type:"dd", cols:2,
       q:`Answer the following without technology.`,
       parts:[
         {t:`(a) ${LG(10,100)} =`, o:["1/2","2","10","100"], a:1},
         {t:`(a) ${LG(100,10)} =`, o:["1/2","2","10","100"], a:0},
         {t:`(b) ${LG(2,4)} =`, o:["1/2","2","4","8"], a:1},
         {t:`(b) ${LG(4,2)} =`, o:["2","1/2","4","8"], a:1},
         {t:`(c) If ${PW("a","2")} = b, then a =`, b:true, o:[PW("b","2"), PW("b","1/2"), "2b", "b/2"], a:1}],
       hint:`${LG("b","x")} asks, “b to what power gives x?” For example, ${LG(5,125)} = 3 because ${PW(5,3)} = 125. For ${LG(100,10)}, call the unknown exponent x and write it as an exponential equation. For (c), what operation undoes squaring, and how could you write that operation as an exponent?`},

      {std:[S_LE4], n:"7H", honors:true, type:"dd",
       q:`Andre says that ${LG(10,55)} = 1.5 because 55 is halfway between 10 and 100. Do you agree with Andre’s explanation? Explain your reasoning without the use of technology.`,
       parts:[
         {t:`(a) Do you agree with Andre?`, o:["Agree","Disagree"], a:1},
         {t:`(b) Why`, b:true, o:[`Agree: halfway between 10 and 100 means halfway between 1 and 2`, `Disagree: ${PW(10,"1.5")} ≈ 31.6, not 55, so ${LG(10,55)} is greater than 1.5 (about 1.74)`, `Disagree: ${LG(10,55)} = 5.5`, `Agree: 10 × 5.5 = 55`], a:1}],
       hint:`${LG(10,55)} is the exponent on 10 that gives 55. Test Andre’s claim by converting it: if ${LG(10,55)} were 1.5, then ${PW(10,"1.5")} would have to equal 55. Use ${PW(10,1)} = 10 and ${PW(10,2)} = 100, and think about whether halfway between the exponents means halfway between the results.`}
    ]},
    { id:"6", title:"Solving Exponential Equations", problems:[
      {std:[S_REI1,S_LE4], n:"1", type:"dd", cols:2,
       q:`Solve each equation without using a calculator. Some solutions will need to be expressed using log notation.`,
       parts:[
         {t:`a. 4 · ${PW(10,"x")} = 400,000`, b:true, o:[`x = log 400,000`, `x = 5`, `x = 100,000`, `x = log 4`], a:1},
         {t:`b. ${PW(10,"n+1")} = 1`, b:true, o:[`n = 0`, `n = 1`, `n = −1`, `n = −10`], a:2},
         {t:`c. ${PW(10,"3n")} = 1,000,000`, b:true, o:[`n = 6`, `n = 2`, `n = 3`, `n = 18`], a:1},
         {t:`d. ${PW(10,"p")} = 725`, b:true, o:[`p = 72.5`, `p = log 72.5`, `p = log 725`, `p = ${PW(10,"725")}`], a:2},
         {t:`e. 6 · ${PW(10,"t")} = 360`, b:true, o:[`t = log 360`, `t = 60`, `t = log 2,160`, `t = log 60`], a:3}],

      {std:[S_LE4,S_CED1], n:"3", retired:true, type:"dd", side:true,

      {std:[S_REI1,S_IF7], n:"5", type:"dd",

       hint:`Isolate the exponential expression in each equation. Then ask yourself what kinds of numbers an exponential expression with a positive base can actually equal.`},

      {std:[S_REI1], n:"6", type:"dd",

      {std:[S_REI1,S_LE4], n:"2H", honors:true, type:"dd",

       hint:`Divide to isolate the power of 10, then convert: ${PW(10,"y")} = N becomes y = log N, where y is the whole exponent 0.2t. Ask yourself whether your number is a power of 10, and which one.`},

      {std:[S_CED2,S_LE4], n:"11H", retired:true, honors:true, type:"dd",
       q:`A piece of paper has an area of 93.5 square inches. How many times does it need to be folded in half before the area is less than 1 square inch? Explain how you know.`,
       parts:[
         {t:`(a) After n folds the area is 93.5 ÷ ${PW(2,"n")}. To get less than 1 square inch, you need`, b:true, o:[`${PW(2,"n")} > 93.5, so n > ${LG(2,"93.5")} ≈ 6.5`, `${PW(2,"n")} < 93.5, so n < ${LG(2,"93.5")}`, `${PW(2,"n")} > 1, so n > ${LG(2,1)} = 0`, `${PW(10,"n")} > 93.5, so n > log 93.5 ≈ 2`], a:0},

// Draws the graph of y = 3^x used in Lesson 3, Problem 4.
function expGraph(){
  const W=360,H=250,L=52,R=345,T=12,B=205,xmax=9.5,ymax=12000;
  const sx=x=>L+(R-L)*x/xmax, sy=y=>B-(B-T)*y/ymax;
  let g="";
  for(let x=1;x<=9;x++) g+=`<line class="gl" x1="${sx(x)}" y1="${T}" x2="${sx(x)}" y2="${B}"/><text class="tl" x="${sx(x)}" y="${B+16}" text-anchor="middle">${x}</text>`;
  for(let y=2000;y<=12000;y+=2000) g+=`<line class="gl" x1="${L}" y1="${sy(y)}" x2="${R}" y2="${sy(y)}"/><text class="tl" x="${L-6}" y="${sy(y)+3}" text-anchor="end">${y}</text>`;
  let d=""; for(let x=0;x<=8.54;x+=0.05){ d += (d?"L":"M") + sx(x).toFixed(1) + " " + sy(Math.pow(3,x)).toFixed(1) + " "; }
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graph of y equals 3 to the x power, rising steeply from 1 at x equals 0 to about 12,000 near x equals 8.5">${g}
    <line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${B}"/><line class="ax" x1="${L}" y1="${B}" x2="${R}" y2="${B}"/>
    <text class="tl" x="${R+2}" y="${B+4}">x</text><text class="tl" x="${L-4}" y="${T-2}" text-anchor="end">y</text>
    <path class="cv" d="${d}"/></svg>`;
}

// ---- COMMON MISCONCEPTIONS (shown to the teacher on the Standards mastery page) ----
// Every wrong answer choice that shows a recognizable mistake is tagged below. When a student checks a wrong
// answer, the choice they picked tells us which misconception it was. Nothing extra is stored: it is worked out
// from the wrong answers already saved with each student's progress.
const MISC = {
  swap:        {t:"Swaps the base and the result when converting between forms", eg:`writes ${LG(81,3)} = 4 for ${PW(3,4)} = 81`},
  placement:   {t:"Puts the exponent and the result in the wrong places", eg:`writes ${LG(3,4)} = 81 for ${PW(3,4)} = 81`},
  expAsBase:   {t:"Uses the exponent as the base of the log", eg:`writes ${LG("−2",5)} = 1/25 for ${PW(5,"−2")} = 1/25`},
  wrongBase:   {t:"Uses the wrong number as the base", eg:`writes ${LG(4,81)} = 3 for ${PW(3,4)} = 81`},
  logAsOp:     {t:"Reads a log as an ordinary operation (times, power) instead of an exponent", eg:`treats ${LG(2,64)} as 2 × 64`},
  logValue:    {t:"Gives the base or the number inside the log instead of the exponent", eg:`says ${LG(10,"1,000")} = 1,000`},
  noConvert:   {t:"Doesn’t convert to exponential form to check or evaluate a log", eg:`guesses whether ${LG(5,20)} equals ${LG(2,8)} without converting`},
  expMeaning:  {t:"Confuses what an exponent means (divides or adds instead of repeated multiplication)", eg:`says ${PW(2,"a")} = 32 means a = 16`},
  countError:  {t:"Miscounts powers or is off by one when estimating a log or counting steps", eg:`says ${LG(2,6)} is between 1 and 2`},
  zeroExp:     {t:"Misunderstands zero and negative exponents", eg:`says ${PW(10,"−1")} = −10`},
  reciprocal:  {t:"Inverts a log value (gives the reciprocal)", eg:`says ${LG(10,100)} = 1/2`},
  rootPower:   {t:"Mixes up powers and roots (squares vs. square roots, rational exponents)", eg:`says ${PW("a",2)} = b means a = ${PW("b",2)}`},
  halfway:     {t:"Assumes a log is halfway because the number is halfway on the number line", eg:`says ${LG(10,55)} = 1.5 because 55 is halfway between 10 and 100`},
  noIsolate:   {t:"Takes the log before isolating the power", eg:`writes x = log 400,000 for 4 · ${PW(10,"x")} = 400,000`},
  wrongOp:     {t:"Uses the wrong operation to isolate the power (multiplies instead of divides)", eg:`writes t = log 2,160 for 6 · ${PW(10,"t")} = 360`},
  coefExp:     {t:"Forgets to divide by the coefficient on the exponent", eg:`says ${PW(10,"3n")} = 1,000,000 gives n = 6`},
  signExp:     {t:"Makes a sign or algebra slip when solving for the exponent", eg:`says ${PW(10,"n+1")} = 1 gives n = 0`},
  dropPart:    {t:"Drops a step or part of the exponent when converting (forgets the log, or drops the +2)", eg:`says ${PW(10,"d+2")} = 1 gives d = log 1`},
  sameBase:    {t:"Doesn’t see that matching bases let you set the exponents equal", eg:`can’t explain why ${PW(5,"3−2x")} = ${PW(5,"−x")} needs no logs`},
  negExp:      {t:"Doesn’t recognize that a positive base never gives a negative result", eg:`thinks ${PW(4,"x")} = −1/2 has a solution, or that log(−10) = −1`},
  wholePower:  {t:"Thinks a solution has to be a whole-number power", eg:`says an equation has no solution because the number isn’t a whole power of the base`},
  graphRead:   {t:"Misreads a graph or table (wrong interval, axis, or column)", eg:`reads the wrong interval on the graph of ${PW(3,"x")}`},
  linear:      {t:"Treats exponential growth as linear (adds instead of multiplying)", eg:`finds $255.00 by adding $52.50 twice`},
  percentFactor:{t:"Converts a percent to a growth factor incorrectly (0.05 for 5%, 1.58 for 0.58%, 24% for 0.24%)", eg:`uses ${PW("0.05","t")} instead of ${PW("1.05","t")} for a 5% increase`},
  periods:     {t:"Ignores the number of compounding periods", eg:`uses ${PW("1.0058","t")} instead of ${PW("1.0058","12t")}`},
  compareRates:{t:"Compares growth rates without putting them on the same time period", eg:`says a monthly 0.24% beats a yearly 3% without converting`},
  costSetup:   {t:"Leaves out the free month or the one-time fee when finding a total cost", eg:`finds Service A’s year as 12 × $9 = $108`},
  averageCalc: {t:"Finds an average price per month incorrectly (doesn’t divide by 12, or uses the wrong number of months)", eg:`gives $99 as the monthly average instead of $99 ÷ 12`},
  addFactor:   {t:"Adds the growth factor instead of multiplying by it", eg:`finds 400 + 1.5 = 401.5 after one month`},
  factorTimes: {t:"Multiplies by the factor and the number of periods instead of using the factor repeatedly", eg:`finds 400 × 1.5 × 4 = 2,400 after 4 months`},
  growthDecay: {t:"Mixes up growth and decay (a factor below 1 for an increase, or above 1 for a decrease)", eg:`matches “25% off” with 1.25`},
  roleSwap:    {t:"Mixes up the roles of the numbers in a · bˣ (starting value, growth factor, exponent)", eg:`writes w = 1.2 · ${PW(100,"t")} instead of w = 100 · ${PW("1.2","t")}`},
  inputOutput: {t:"Mixes up the input and the output of a function in context", eg:`says m(0.5) is the time when 0.5 mg is left`},
  timeRead:    {t:"Treats a clock time as a decimal", eg:`reads 4:30 p.m. as 4.3 hours after noon`},
  unitConvert: {t:"Doesn’t convert the units of the input (years to decades)", eg:`uses ${PW("0.6",4)} for 4 years when d is in decades`},
  fractionOfYear:{t:"Uses the number of months (or the wrong fraction of a year) as the exponent", eg:`writes ${PW("1.1","1/3")} for every 3 months`},
  rateDirection:{t:"Raises the yearly factor to a whole-number power to get a factor for part of a year", eg:`says the monthly factor is ${PW(3,12)} when the yearly factor is 3`},
  startVsRate: {t:"Confuses the starting value with the growth rate", eg:`says Saudi Arabia grows faster because 31 is bigger than 17`},
  intersect:   {t:"Misreads what the intersection of two graphs means", eg:`says the crossing point shows when the growth factors are the same`},
  swapXY:      {t:"Writes a point backwards (swaps x and y)", eg:`gives (271.587, 15.357) instead of (15.357, 271.587)`},
  orderOps:    {t:"Order-of-operations slip when evaluating a function", eg:`finds f(2) for 3x² + 2x − 5 as (3 · 2)² + 2 · 2 − 5`},
  invOp:       {t:"Writes the inverse with the wrong operation instead of a log", eg:`says the inverse of ${PW(8,"x")} is ${PW("x",8)}`},
  invShift:    {t:"Misplaces the shift when inverting", eg:`writes ${LG("1.3","x")} − 4 instead of ${LG("1.3","x − 4")}`},

// attach the tags to the options (before the choices get mixed up, so each tag travels with its option)
(function tagChoices(){
  Object.keys(MIS_MAP).forEach(key => {
    const [lid, n, part] = key.split(".");
    const l = CONTENT[5].find(x => x.id === lid), p = l && l.problems.find(x => x.n === n); if(!p) return;
    const opts = part === undefined ? p.c : p.parts[+part].o, tags = new Array(opts.length).fill(null);
    Object.keys(MIS_MAP[key]).forEach(i => { tags[+i] = MIS_MAP[key][i]; });
    if(part === undefined) p.cm = tags; else p.parts[+part].m = tags;
  });
})();

// Mix up the order of the wordy answer choices so the right answer isn't usually in the same spot.
// The mix is fixed for each problem (same order every time a student opens it). Ordered lists such as "1 and 2", "2 and 3" stay as written.
(function mixChoices(){
  const seeded = seed => { let h = 2166136261; for(const ch of seed){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967296; }; };
  const mix = (opts, ans, seed, tags) => {
    const rnd = seeded(seed), idx = opts.map((_, i) => i);
    for(let i = idx.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    return {o: idx.map(i => opts[i]), a: idx.indexOf(ans), m: tags ? idx.map(i => tags[i]) : null};
  };
  Object.keys(CONTENT).forEach(u => CONTENT[u].forEach(l => l.problems.forEach(p => {
    const key = `${u}-${l.id}-${p.n}`;
    if(p.type === "mc" && p.c.length > 2){ const m = mix(p.c, p.a, key, p.cm); p.c = m.o; p.a = m.a; if(m.m) p.cm = m.m; }
    if(p.type === "dd") p.parts.forEach((pt, j) => { if(pt.b && pt.o.length > 2){ const m = mix(pt.o, pt.a, key + "-" + j, pt.m); pt.o = m.o; pt.a = m.a; if(m.m) pt.m = m.m; } });
  })));
})();

// Draws a simple graph: grid, axes, up to two curves (clipped to the window), and labeled points.
function gGraph(c){
  const W = 380, H = 250, L = 58, R = 366, T = 14, B = 208;
  const sx = x => L + (R - L) * (x - c.x0) / (c.x1 - c.x0), sy = y => B - (B - T) * (y - c.y0) / (c.y1 - c.y0), f1 = v => v.toFixed(1);
  let g = "";
  c.xt.forEach(x => g += `<line class="gl" x1="${f1(sx(x))}" y1="${T}" x2="${f1(sx(x))}" y2="${B}"/><text class="tl" x="${f1(sx(x))}" y="${B + 15}" text-anchor="middle">${x}</text>`);
  c.yt.forEach(y => g += `<line class="gl" x1="${L}" y1="${f1(sy(y))}" x2="${R}" y2="${f1(sy(y))}"/><text class="tl" x="${L - 6}" y="${f1(sy(y) + 3)}" text-anchor="end">${y}</text>`);
  (c.curves || []).forEach((cv, i) => {
    let d = "", first = true;
    for(let k = 0; k <= 240; k++){
      const x = cv.xa + (cv.xb - cv.xa) * k / 240, y = cv.f(x);
      if(y > c.y1 || y < c.y0){ if(first) continue; else break; }
      d += (first ? "M" : "L") + f1(sx(x)) + " " + f1(sy(y)) + " "; first = false;
    }
    g += `<path class="cv${i ? " cv2" : ""}" d="${d}"/>`;
    if(cv.label) g += `<text class="tl lab${i ? " lab2" : ""}" x="${f1(sx(cv.lx))}" y="${f1(sy(cv.ly))}">${cv.label}</text>`;
  });
  (c.pts || []).forEach(p => g += `<circle class="pt" cx="${f1(sx(p.x))}" cy="${f1(sy(p.y))}" r="3.4"/><text class="tl" x="${f1(sx(p.x) + (p.dx || 6))}" y="${f1(sy(p.y) + (p.dy || -6))}">${p.t}</text>`);
  return `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.alt}">${g}<line class="ax" x1="${L}" y1="${T}" x2="${L}" y2="${B}"/><line class="ax" x1="${L}" y1="${B}" x2="${R}" y2="${B}"/>` +
    `<text class="tl" x="${(L + R) / 2}" y="${H - 6}" text-anchor="middle">${c.xl}</text><text class="tl" transform="rotate(-90 13 ${(T + B) / 2})" x="13" y="${(T + B) / 2}" text-anchor="middle">${c.yl}</text></svg>`;
}

let progress = {};

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function sha(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}
function storeKey(){ return "mph4:" + S.student.h; }
// Everything a student does is saved in this browser under their own ID: each checked answer, each hint, and now
// the selections they have made but not checked yet. Another student on the same device never sees it.
const DRAFT_VER = "2026-11-01a";    // change this whenever answer choices change, so old unchecked selections are dropped
function load(){ try{ progress = JSON.parse(localStorage.getItem(storeKey())) || {}; }catch(e){ progress = {}; } resetLive(); loadDrafts(); }
function save(){ try{ localStorage.setItem(storeKey(), JSON.stringify(progress)); }catch(e){} saveDrafts(); bkMark(); }
// bring work saved under a corrected student's old ID (on this Chromebook) over to the new ID. The old copy is left in place as a safety net.
function migrateAliases(){
  const st = S.student; if(!st || !st.aliasH || !st.aliasH.length) return;
  let moved = 0;
  st.aliasH.forEach(h => {
    let old = null; try{ old = JSON.parse(localStorage.getItem("mph4:" + h)); }catch(e){}
    if(!old) return;
    Object.keys(old).forEach(k => { const o = old[k], l = progress[k]; if(o && (!l || bkAhead(o, l))){ progress[k] = o; moved++; } });
  });
  if(moved){ try{ localStorage.setItem(storeKey(), JSON.stringify(progress)); }catch(e){} }
}
function resetLive(){ [draft, lastWrong, selChip].forEach(o => Object.keys(o).forEach(k => delete o[k])); }
const draftKey = () => "mph4d:" + S.student.h;
function loadDrafts(){
  try{
    const o = JSON.parse(localStorage.getItem(draftKey()));
    if(o && o.v === DRAFT_VER && o.d) Object.keys(o.d).forEach(k => { if(!(progress[k] && progress[k].d)) draft[k] = o.d[k]; });
  }catch(e){}
}
function saveDrafts(){
  if(!S.student) return;
  try{
    const d = {};
    Object.keys(draft).forEach(k => { if(!(progress[k] && progress[k].d) && draft[k].some(v => v > -1)) d[k] = draft[k]; });
    localStorage.setItem(draftKey(), JSON.stringify({v: DRAFT_VER, d}));
  }catch(e){}
}

function problemsFor(lesson){
  return lesson.problems.map((p,i) => ({...p, id:S.unit + "-" + lesson.id + "-" + i, _pos: p.pos !== undefined ? p.pos : i * 10}))
    .filter(p => !p.retired && (S.student.level === "honors" || !p.honors))
    .sort((a, b) => a._pos - b._pos);
}
function pts(p){ const r = progress[p.id]; if(!(r && r.d)) return null; const [u, l] = p.id.split("-"); return Math.max(0, 100 - PENALTY * r.w.length - (isLate(u, l, r) ? LATE_PENALTY : 0)); }
function summary(lesson){
  const ps = problemsFor(lesson);
  const done = ps.filter(p => progress[p.id] && progress[p.id].d);
  const total = done.reduce((s,p) => s + pts(p), 0);
  return {n:ps.length, done:done.length, acc: done.length ? Math.round(total/done.length) : null};
}
function pstate(p){
  const r = progress[p.id];
  if(r && r.d) return "done";
  if(r && (r.w.length || r.h)) return "prog";
  return "todo";
}
const STATE_LABEL = {done:"complete", prog:"in progress", todo:"not started"};
function bubbles(lesson, mode, idx){
  return problemsFor(lesson).map(p => {
    const st = pstate(p);
    const attrs = mode === "open" ? `data-open="${p.id}" data-lesson="${idx}"` : `data-jump="${p.id}"`;
    const [bu, bl] = p.id.split("-"), late = st === "done" && isLate(bu, bl, progress[p.id]);
    return `<button class="bub ${st} ${late ? "late" : ""}" ${attrs} aria-label="Problem ${esc(p.n)}, ${STATE_LABEL[st]}${late ? ", finished late" : ""}">${esc(p.n)}</button>`;
  }).join("");
}
function statusRow(lesson, mode, idx){
  const s = summary(lesson);
  if(!s.n) return `<span class="pill ghost">Coming soon</span>`;
  return `<span class="pill">${s.done===s.n?"Complete":"In progress"} ${s.done}/${s.n}</span>` +
    `<span class="bubs ${s.n > 8 ? "many" : ""}">${bubbles(lesson, mode, idx)}</span>` +
    `<span class="pill acc">Accuracy ${s.acc!==null ? s.acc + "%" : "—"}</span>`;
}

// ---- DEADLINES: a countdown per part; problems stay open forever and late work is marked ----
const pad2 = n => String(n).padStart(2, "0");
const unitWord = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const partsOf = u => DUE_PARTS[u] || [];
const partFor = (u, lessonId) => partsOf(u).find(p => p.lessons.includes(String(lessonId))) || null;
const partClass = l => { const pt = partFor(S.unit, l.id); return pt ? "p" + pt.part : ""; };
const dueLabel = part => part.due.toLocaleDateString("en-US", {weekday:"short", month:"short", day:"numeric"});
function dueState(part){
  const ms = part.due - Date.now(), a = Math.abs(ms);
  return {late: ms <= 0, today: ms > 0 && a < 86400000, days: Math.floor(a / 86400000), hrs: Math.floor(a % 86400000 / 3600000), min: Math.floor(a % 3600000 / 60000)};
}
// was this finished problem completed after its part's deadline?
const isLate = (unit, lessonId, r) => { const pt = partFor(unit, lessonId); return !!(pt && r && r.d && r.t && r.t > pt.due.getTime()); };
// a small tag in the problem's title bar once the deadline has passed
function lateTag(p){
  const [u, l] = p.id.split("-"), pt = partFor(u, l); if(!pt) return "";
  const r = progress[p.id];
  if(r && r.d) return isLate(u, l, r) ? ` <span class="pill sm latetag">Finished late</span>` : "";
  return Date.now() > pt.due.getTime() ? ` <span class="pill sm latetag">Past due</span>` : "";
}
function dueText(part){
  const s = dueState(part), lab = dueLabel(part);
  return s.late ? `Part ${part.part} was due ${lab} · <b>${unitWord(s.days, "day")} late</b> (still open)`
    : s.today ? `Part ${part.part} is due <b>today at 11:59 PM</b> · ${unitWord(s.hrs, "hr")} ${s.min} min left`
    : `Part ${part.part} is due ${lab} · <b>${unitWord(s.days, "day")} ${unitWord(s.hrs, "hr")}</b> left`;
}
// one line for the first page: every deadline in the unit
function dueLines(u){
  const ps = partsOf(u); if(!ps.length) return "";
  return `<p class="dueline ${ps.some(p => dueState(p).late) ? "late" : ""}" data-due data-unit="${u}" data-kind="lines"><span class="dl-u">Unit ${u}</span>` +
    ps.map(p => `<span class="dl-p p${p.part} ${dueState(p).late ? "late" : ""}">${dueText(p)}</span>`).join("") + `</p>`;
}
function dueHtml(u, partNo, kind){
  const part = partsOf(u).find(p => p.part === partNo); if(!part) return "";
  const s = dueState(part), lab = dueLabel(part), cls = (s.late ? "late" : s.today ? "soon" : "ok") + " p" + part.part;
  const at = `data-due data-unit="${u}" data-part="${partNo}" data-kind="${kind}"`;
  if(kind === "mini"){
    return `<div class="due mini ${cls}" ${at}>` + (s.late ? `<b>${unitWord(s.days, "day")} late</b><small>Part ${partNo} was due ${lab} · still open</small>`
      : s.today ? `<b>${unitWord(s.hrs, "hr")} ${s.min} min</b> left<small>Part ${partNo} is due today at 11:59 PM</small>`
      : `<b>${unitWord(s.days, "day")} ${unitWord(s.hrs, "hr")}</b> left<small>Part ${partNo} · due ${lab}</small>`) + `</div>`;
  }
  const head = s.late ? `Part ${partNo} · Past due` : s.today ? `Part ${partNo} · Due today` : `Part ${partNo} · Due ${lab}`;
  const nums = s.late ? `<span><b>${s.days}</b>days</span><span><b>${pad2(s.hrs)}</b>hrs</span>`
    : s.today ? `<span><b>${pad2(s.hrs)}</b>hrs</span><span><b>${pad2(s.min)}</b>min</span>`
    : `<span><b>${s.days}</b>days</span><span><b>${pad2(s.hrs)}</b>hrs</span><span><b>${pad2(s.min)}</b>min</span>`;
  return `<div class="due ${cls}" ${at}><div class="dhead">${head}</div><div class="dbody"><div class="dcount">${nums}</div><div class="dnote">${s.late ? `late · was due ${lab} · still open` : "until the homework is due"}</div></div></div>`;
}
function tickDue(){
  document.querySelectorAll("[data-due]").forEach(e => {
    const u = +e.dataset.unit;
    e.outerHTML = e.dataset.kind === "lines" ? dueLines(u) : dueHtml(u, +e.dataset.part, e.dataset.kind);
